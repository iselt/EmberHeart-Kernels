name: Notify Telegram
description: Send a text message, single document, or media group to a Telegram chat/thread

inputs:
  bot_token:
    description: 'Telegram bot token'
    required: true
  chat_id:
    description: 'Target chat ID (channel/group, negative for supergroups)'
    required: true
  thread_id:
    description: 'message_thread_id of the target forum topic/thread'
    required: true
  mode:
    description: 'text | document | media-group | rich | rich-with-file'
    required: true
  message:
    description: 'Markdown-formatted text (used as message body for text mode, or caption for document/media-group)'
    required: false
    default: ''
  files:
    description: 'Newline-separated list of file paths (required for document/media-group modes)'
    required: false
    default: ''
  api_base_url:
    description: 'Bot API base URL, no trailing slash (e.g. https://api.telegram.org or http://localhost:8081 for a local server)'
    required: false
    default: 'https://api.telegram.org'

runs:
  using: composite
  steps:
    - name: Send to Telegram
      shell: bash
      env:
        BOT_TOKEN: ${{ inputs.bot_token }}
        CHAT_ID: ${{ inputs.chat_id }}
        THREAD_ID: ${{ inputs.thread_id }}
        MODE: ${{ inputs.mode }}
        MESSAGE: ${{ inputs.message }}
        FILES_RAW: ${{ inputs.files }}
        API_BASE_URL: ${{ inputs.api_base_url }}
      run: |
        set -euo pipefail
        API="${API_BASE_URL%/}/bot${BOT_TOKEN}"

        send_media_group() {
          # Sends $FILES_LIST as a media group with NO caption — captions can't be
          # rich, so any text content belongs in a separate rich message.
          mapfile -t FILES_LIST < <(printf '%s\n' "$FILES_RAW" | sed '/^\s*$/d')
          EXISTING_FILES=()
          for f in "${FILES_LIST[@]}"; do
            if [ -f "$f" ]; then
              EXISTING_FILES+=("$f")
            else
              echo "::warning::[notify-telegram] File not found, skipping: $f"
            fi
          done

          if [ ${#EXISTING_FILES[@]} -eq 0 ]; then
            echo "::warning::[notify-telegram] No valid files found, skipping media group."
            return 0
          fi

          if [ ${#EXISTING_FILES[@]} -gt 10 ]; then
            echo "::warning::[notify-telegram] More than 10 files given; Telegram allows max 10 per group. Truncating."
            EXISTING_FILES=("${EXISTING_FILES[@]:0:10}")
          fi

          MEDIA_JSON="["
          CURL_ARGS=()
          for i in "${!EXISTING_FILES[@]}"; do
            f="${EXISTING_FILES[$i]}"
            attach="file$i"
            MEDIA_JSON+="{\"type\":\"document\",\"media\":\"attach://$attach\"}"
            if [ "$i" -lt $((${#EXISTING_FILES[@]}-1)) ]; then
              MEDIA_JSON+=","
            fi
            CURL_ARGS+=(-F "$attach=@$f")
          done
          MEDIA_JSON+="]"

          if resp=$(curl -s -w '\n%{http_code}' -F chat_id="$CHAT_ID" \
            -F message_thread_id="$THREAD_ID" \
            -F media="$MEDIA_JSON" \
            "${CURL_ARGS[@]}" \
            "$API/sendMediaGroup"); then
            http_code=$(echo "$resp" | tail -n1)
            body=$(echo "$resp" | sed '$d')
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "::warning::[notify-telegram] sendMediaGroup failed (HTTP $http_code): $body"
              return 0
            fi
            echo "[notify-telegram] Sent media group with ${#EXISTING_FILES[@]} files."
          else
            curl_exit=$?
            echo "::warning::[notify-telegram] curl failed to execute sendMediaGroup (curl exit code $curl_exit)."
            for f in "${EXISTING_FILES[@]}"; do ls -la "$f" 2>&1 || echo "::warning::[notify-telegram] $f no longer exists."; done
          fi
        }

        send_rich_text() {
          if [ -z "$MESSAGE" ]; then
            echo "::warning::[notify-telegram] No message provided, skipping rich text."
            return 0
          fi

          RICH_JSON=$(printf '%s' "$MESSAGE" | python3 -c 'import json,sys; print(json.dumps({"markdown": sys.stdin.read()}))')

          if resp=$(curl -s -w '\n%{http_code}' -X POST "$API/sendRichMessage" \
            -d chat_id="$CHAT_ID" \
            -d message_thread_id="$THREAD_ID" \
            --data-urlencode rich_message="$RICH_JSON"); then
            http_code=$(echo "$resp" | tail -n1)
            body=$(echo "$resp" | sed '$d')
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "::warning::[notify-telegram] sendRichMessage failed (HTTP $http_code): $body"
              return 0
            fi
            echo "[notify-telegram] Rich text message sent."
          else
            curl_exit=$?
            echo "::warning::[notify-telegram] curl failed to execute sendRichMessage (curl exit code $curl_exit)."
          fi
        }

        case "$MODE" in
          text)
            if resp=$(curl -s -w '\n%{http_code}' -X POST "$API/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d message_thread_id="$THREAD_ID" \
              -d parse_mode="Markdown" \
              -d disable_web_page_preview="true" \
              --data-urlencode text="$MESSAGE"); then
              http_code=$(echo "$resp" | tail -n1)
              body=$(echo "$resp" | sed '$d')
              if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
                echo "::warning::[notify-telegram] sendMessage failed (HTTP $http_code): $body"
                exit 0
              fi
              echo "[notify-telegram] Text message sent."
            else
              curl_exit=$?
              echo "::warning::[notify-telegram] curl failed to execute sendMessage (curl exit code $curl_exit)."
            fi
            ;;

          document)
            mapfile -t FILES_LIST < <(printf '%s\n' "$FILES_RAW" | sed '/^\s*$/d')

            if [ ${#FILES_LIST[@]} -eq 0 ]; then
              echo "::warning::[notify-telegram] No files provided for document mode, skipping."
              exit 0
            fi

            for f in "${FILES_LIST[@]}"; do
              if [ ! -f "$f" ]; then
                echo "::warning::[notify-telegram] File not found: $f — skipping."
                continue
              fi
              if resp=$(curl -s -w '\n%{http_code}' -F document=@"$f" \
                   -F chat_id="$CHAT_ID" \
                   -F message_thread_id="$THREAD_ID" \
                   -F caption="$MESSAGE" \
                   -F parse_mode="Markdown" \
                   "$API/sendDocument"); then
                http_code=$(echo "$resp" | tail -n1)
                body=$(echo "$resp" | sed '$d')
                if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
                  echo "::warning::[notify-telegram] sendDocument failed for $f (HTTP $http_code): $body"
                  continue
                fi
                echo "[notify-telegram] Sent document: $(basename "$f")"
              else
                curl_exit=$?
                echo "::warning::[notify-telegram] curl failed to execute sendDocument for $f (curl exit code $curl_exit) — file may have been unreadable or removed mid-run."
                ls -la "$f" 2>&1 || echo "::warning::[notify-telegram] $f no longer exists."
              fi
            done
            ;;

          media-group)
            send_media_group
            ;;

          rich)
            send_rich_text
            ;;

          rich-with-file)
            send_media_group
            send_rich_text
           ;;

          *)
            echo "::error::[notify-telegram] Unknown mode: $MODE"
            exit 1
            ;;
        esac
