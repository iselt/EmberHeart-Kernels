name: Build kernel modules
description: "Builds Kernel modules and dtbs"

inputs:
  optimize_level:
    required: false
    type: string
    default: O2  # Choices: O2 or O3
  lto:
    required: false
    type: string
    default: thin  # Choices: thin or full
  evict_unused_ccache:
    description: 'Do you want to evict unused ccache?'
    required: true
    type: string
    default: 'false'
  compile_dlkm:
    description: 'Do you want to compile dlkm and vendor boot?'
    required: false
    type: string
    default: 'false'
  tg_enabled:
    description: 'Whether Telegram notifications are configured (from tg_check gate)'
    required: false
    type: string
    default: 'false'
  tg_bot_token:
    required: false
    type: string
    default: ''
  tg_chat_id:
    required: false
    type: string
    default: ''
  tg_thread_id:
    required: false
    type: string
    default: ''
  tg_api_base:
    description: 'Bot API base URL (local server or cloud API)'
    required: false
    type: string
    default: 'https://api.telegram.org'
  tg_send_debug:
    description: 'Whether to send the debug bundle (false for release/pre-release builds)'
    required: false
    type: string
    default: 'true'

outputs:
  vendor_boot_sha256:
    value: ${{ steps.create_vendor_boot.outputs.vendor_boot_sha256 }}
  vendor_dlkm_sha256:
    value: ${{ steps.create_vendor_dlkm.outputs.vendor_dlkm_sha256 }}

runs:
  using: composite
  steps:
    - name: Clean environment for Mixed builds
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "$ARTIFACTS_DIR/" || true
        rm -rf "$ARTIFACTS_DIR_DEBUG/" || true
        rm -rf "$CCACHE_DIR/" || true
        rm -rf "$LDCACHE_DIR/" || true

        mkdir -p "$ARTIFACTS_DIR"
        mkdir -p "$ARTIFACTS_DIR_DEBUG"
        mkdir -p "$CCACHE_DIR"
        mkdir -p "$LDCACHE_DIR"

    - name: Get Kernel Version Info
      shell: bash
      run: |
        set -euo pipefail
        cd "$MSM"
        CONFIG_FILES=("build.config.common" "build.config.constants")
        BRANCH_LINE=""
        for f in "${CONFIG_FILES[@]}"; do
          if [[ -f "$f" ]]; then
            l=$(grep '^[[:space:]]*BRANCH=' "$f" || true)
            if [[ -n "$l" ]]; then BRANCH_LINE="$l"; break; fi
          fi
        done
        if [[ -z "$BRANCH_LINE" ]]; then
          echo "Error: No BRANCH= found"; exit 1
        fi
        BRANCH_VALUE="${BRANCH_LINE#*=}"
        ANDROID_RELEASE="${BRANCH_VALUE%-*}"
        if [[ -z "$ANDROID_RELEASE" ]]; then
          echo "Could not parse android version from BRANCH=$BRANCH_VALUE"
          exit 1
        fi
        KERNEL_VERSION=$(make kernelversion)
        VERSION=$(echo $KERNEL_VERSION | cut -d'.' -f1)
        PATCHLEVEL=$(echo $KERNEL_VERSION | cut -d'.' -f2)
        SUBLEVEL=$(echo $KERNEL_VERSION | cut -d'.' -f3)
        cd "$ARTIFACTS_DIR"
        echo "ANDROID_RELEASE=$ANDROID_RELEASE" >> "$GITHUB_ENV"
        echo "KERNEL_VER=$VERSION.$PATCHLEVEL" >> "$GITHUB_ENV"
        echo "KERNEL_FULL_VER=$ANDROID_RELEASE-$KERNEL_VERSION" >> "$GITHUB_ENV"
        echo "SUSFS_KERNEL_BRANCH=gki-$ANDROID_RELEASE-$VERSION.$PATCHLEVEL" >> "$GITHUB_ENV"

        cd "$COMMON"
        CONFIG_FILES=("build.config.common" "build.config.constants")
        BRANCH_LINE=""
        for f in "${CONFIG_FILES[@]}"; do
          if [[ -f "$f" ]]; then
            l=$(grep '^[[:space:]]*BRANCH=' "$f" || true)
            if [[ -n "$l" ]]; then BRANCH_LINE="$l"; break; fi
          fi
        done
        if [[ -z "$BRANCH_LINE" ]]; then
          echo "Error: No BRANCH= found"; exit 1
        fi
        BRANCH_VALUE="${BRANCH_LINE#*=}"
        ANDROID_RELEASE_COMMON="${BRANCH_VALUE%-*}"
        if [[ -z "$ANDROID_RELEASE" ]]; then
          echo "Could not parse android version from BRANCH=$BRANCH_VALUE"
          exit 1
        fi
        KERNEL_VERSION_COMMON=$(make kernelversion)
        echo "MIXED_KERNEL_VERSION=$ANDROID_RELEASE_COMMON-$KERNEL_VERSION_COMMON" >> "$GITHUB_ENV"

    - name: Configure ccache
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p "$CCACHE_DIR"

        # For mixed and monolithic builds
        rm -rf "$CCACHE_DIR"

        ccache -o compression=false
        ccache -M 5G

        # Use for ccache eviction
        echo "ccache_start=$(date +%s)" >> "$GITHUB_ENV"

    - name: Restore ccache
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ env.CODENAME }}-${{ env.OS_SHORT }}-modules-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}-${{ inputs.lto }}_LTO
        restore-keys: |
          ccache-${{ env.CODENAME }}-${{ env.OS_SHORT }}-modules-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}
          ccache-${{ env.CODENAME }}-${{ env.OS_SHORT }}-modules-${{ inputs.optimize_level }}-

    - name: Restore LTO cache
      if: ${{ inputs.lto == 'thin'}}
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.LDCACHE_DIR }}
        key: LTO-${{ env.CODENAME }}-${{ env.OS_SHORT }}-modules-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}
        restore-keys: |
          LTO-${{ env.CODENAME }}-${{ env.OS_SHORT }}-modules-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}
          LTO-${{ env.CODENAME }}-${{ env.OS_SHORT }}-modules-${{ inputs.optimize_level }}-

    - name: Restore files for Mixed builds
      if: ${{ env.BUILD_TYPE == 'Modules Only' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.KBUILD_MIXED_TREE_DIR }}
        key: ${{ env.CODENAME }}-${{ env.OS_SHORT }}-MIXED-TREE-${{ inputs.optimize_level }}-${{ env.MIXED_KERNEL_VERSION }}

    - name: Check for Mixed Tree artifacts
      if: ${{ env.BUILD_TYPE == 'Modules Only' || env.BUILD_TYPE == 'Mixed Build' }}
      shell: bash
      run: |
        set -euo pipefail

        if [[ -z "$(ls -A ${KBUILD_MIXED_TREE_DIR})" ]]; then
          echo "[ERROR] Mixed Tree artifacts not found!"
          echo "[ERROR] Make sure mixed artifact for the latest kernel version of Common kernel is available in GitHub caches!"
          echo "[ERROR] Stopping build"
          exit 1
        else
          echo "[SUCCESS] MIXED TREE Artifacts found !"
          echo "$(ls -A ${KBUILD_MIXED_TREE_DIR})"
        fi

    - name: Clean Up ABI Protected Exports
      shell: bash
      run: |
        set -euo pipefail
        rm -f $MSM/android/abi_gki_protected_exports_* || true
        df -h

    - name: Create custom defconfig fragment
      shell: bash
      run: |
        set -euo pipefail
        cd "$MSM"
        touch arch/arm64/configs/modules.config

    - name: Add nethunter specfic drivers already present in kernel to be built as modules
      shell: bash
      run: |
        set -euo pipefail
        cd "$MSM"
        
        # Realtek drivers
        ./scripts/config --file arch/arm64/configs/modules.config \
          -e CONFIG_WLAN_VENDOR_REALTEK

        # ATH drivers
        ./scripts/config --file arch/arm64/configs/modules.config \
          -e CONFIG_WLAN_VENDOR_ATH \
          -m CONFIG_ATH_COMMON \
          -m CONFIG_ATH9K \
          -m CONFIG_ATH9K_HW \
          -m CONFIG_ATH9K_HTC \
          -m CONFIG_ATH9K_COMMON \
          -m CONFIG_ATH10K \
          -m CONFIG_ATH10K_USB \
          -m CONFIG_ATH11K

        # Mediatek drivers
        ./scripts/config --file arch/arm64/configs/modules.config -k \
          -e CONFIG_WLAN_VENDOR_MEDIATEK \
          -m CONFIG_MT7601U \
          -m CONFIG_MT76_CORE \
          -m CONFIG_MT76_USB \
          -m CONFIG_MT76x02_LIB \
          -m CONFIG_MT76x02_USB \
          -m CONFIG_MT76_CONNAC_LIB \
          -m CONFIG_MT7603E \
          -m CONFIG_MT76x2E \
          -m CONFIG_MT76x2U \
          -m CONFIG_MT76x0U \
          -m CONFIG_MT76x0E \
          -m CONFIG_MT7615_COMMON \
          -m CONFIG_MT7615E \
          -m CONFIG_MT7663_USB_SDIO_COMMON \
          -m CONFIG_MT7663U \
          -m CONFIG_MT7663S \
          -m CONFIG_MT7915E \
          -m CONFIG_MT7921E

        # Other configs
        ./scripts/config --file arch/arm64/configs/modules.config \
          -e CONFIG_MAC80211_LEDS \
          -e CONFIG_MAC80211_RC_MINSTREL \
          -m CONFIG_CAN_SLCAN

    - name: Add my kernel patches to msm kernel
      if: env.SOC == 'kalama' && !contains(env.MANIFEST_NAME, 'CUSTOM')
      shell: bash
      run: |
        set -euo pipefail
        echo "Applying kernel patches to msm kernel from my repo..."
        cd "${MSM}"

        if [[ -d "${KERNEL_PATCHES}/kernel_patches/${CODENAME}-${OS_SHORT}/msm" ]]; then
          # We don't need to handle this actually but just in case if someone left an empty dir
          shopt -s nullglob

          for patch in "${KERNEL_PATCHES}/kernel_patches/${CODENAME}-${OS_SHORT}/msm"/*.patch; do
            if patch -p1 -s -f --dry-run < "$patch" >/dev/null 2>&1; then
              echo "Applying patch: ${patch}"
              patch -p1 --forward < "${patch}"
            else
              echo "Skipping patch (conflicts or already applied): ${patch}"
            fi
          done

          shopt -u nullglob
        fi

    - name: Add memkernel module
      shell: bash
      run: |
        set -euo pipefail
        cd "$MSM"
        curl -LSs "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" | bash -s M mem-kernel

    - name: Add rtw88 modules
      shell: bash
      run: |
        set -euo pipefail
        cd "$MSM/drivers/net/wireless/realtek/"
        rm -rf rtw88
        git clone https://github.com/lwfinger/rtw88.git
        sed -i 's/$(CONFIG_RTW88)/m/g' Makefile
        sed -i '/^source "drivers\/net\/wireless\/realtek\/rtw88\/Kconfig"$/s/.*/ /' Kconfig

    - name: Add Build based configs
      if: ${{ env.BUILD_TYPE != 'Monolithic Build' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Applying build based configs..."
        cd "$MSM"

        if [[ "${{ inputs.lto }}" == "none" ]]; then
          ./scripts/config --file arch/arm64/configs/modules.config \
            -d LTO_CLANG \
            -e LTO_NONE \
            -d LTO_CLANG_THIN \
            -d LTO_CLANG_FULL \
            -d THINLTO \
            --set-val FRAME_WARN 0
        elif [[ "${{ inputs.lto }}" == "thin" ]]; then
          ./scripts/config --file arch/arm64/configs/modules.config \
            -e LTO_CLANG \
            -d LTO_NONE \
            -e LTO_CLANG_THIN \
            -d LTO_CLANG_FULL \
            -e THINLTO
        else
          ./scripts/config --file arch/arm64/configs/modules.config \
            -e LTO_CLANG \
            -d LTO_NONE \
            -d LTO_CLANG_THIN \
            -e LTO_CLANG_FULL \
            -d THINLTO
        fi

        # Optimize level config and flags
        if [[ "${{ inputs.optimize_level }}" = "O3" ]]; then
          ./scripts/config --file arch/arm64/configs/modules.config \
             -d CC_OPTIMIZE_FOR_PERFORMANCE \
             -e CC_OPTIMIZE_FOR_PERFORMANCE_O3
        else
          ./scripts/config --file arch/arm64/configs/modules.config \
             -e CC_OPTIMIZE_FOR_PERFORMANCE \
             -d CC_OPTIMIZE_FOR_PERFORMANCE_O3
        fi
        echo "Build configs applied"
        echo "::endgroup::"

    - name: Build Kernel Modules and Dtbs
      shell: bash
      run: |
        set -euo pipefail

        if [[ "$BUILD_TYPE" == "Mixed Build" || "$BUILD_TYPE" == "Modules Only" ]]; then
          export KERNEL_DIR=msm-kernel
        else
          export KERNEL_DIR=common
        fi

        export "ROOT_DIR=${KERNEL_PLATFORM}"
        cd "${ROOT_DIR}"

        # Inherit build config to add device specific changes. ROOT_DIR, KERNEL_DIR are exported for
        # dual tree sources. KERNEL_PATCHES dir can we used for prebuilts (like boot ramdisk,etc)
        # Key features implemented as of now :
        # - PRE_DEFCONFIG_CMDS : commands to be run before running make on the defconfigs
        #                        Example use case : Disabling some configs which might not be required
        #                                           for a specific device (CAN feature on OnePlus 12)
        #                        How to use : export a function in the BUILD_CONFIG, set PRE_DEFCONFIG_CMDS
        #                                     to that function name
        # - POST_DEFCONFIG_CMDS : commands to be run after running make on the defconfigs
        #                        Example use case : <idk>
        #                        How to use : export a function in the BUILD_CONFIG, set POST_DEFCONFIG_CMDS
        #                                     to that function name
        # - EXT_MODULES : List of Out-of-tree vendor modules to be compiled
        # - MAKE_FLAGS : flags to be passed to make for compiling the kernel
        # - MAKE_FLAGS_EXTRA : Extra make flags if required for compatibility reasons
        # - CONFIGS : Array containg defconfigs (and fragments) to be used for building kernel, if not set default configuration 
        #             takes over which works best on GKI sources (especially Xiaomi & OnePlus)
        #                                             to that function name
        #   SYSTEM_DLKM_STAGING_DIR holds the root path of the dlkm partition
        # - SYSTEM_DLKM_EXTRA_CMDS : Extra commands to be executed for device specific needs
        #                            How to use : export a function in the BUILD_CONFIG, set SYSTEM_DLKM_EXTRA_CMDS
        #                                             to that function name
        # - SYSTEM_DLKM_EXTRA_FILES : When defined a custom defined function can be evaluated to decide which file(s)
        #                             goes into the dlkm partition. BUILD_CONFIG can use SYSTEM_DLKM_STAGING_DIR
        #                             as root directory of the system_dlkm partition
        #                             Example use case : copy device specific files from ${PREBUILTS} dir to dlkm partition 
        #                             How to use : export a function in the BUILD_CONFIG, set SYSTEM_DLKM_EXTRA_FILES
        #                                          to that function name
        # - SYSTEM_DLKM_PROPS_FILE : Can store a path to custom props file which is not present in ${PREBUILTS} dir
        #                            Example use case : Use a props file already defined somewhere else (e.g KERNEL_DIR)
        #                            How to use : define SYSTEM_DLKM_PROPS_FILE with absolute path of the props file
        #                            Note :  If system_dlkm.prop is present in the ${PREBUILTS} directory then it will get the highest priority
        # - LZ4_RAMDISK : if set to 1, cpio compressed ramdisk to be used for creating vendor_boot will be compressed using lz4 algo
        #                 To use gzip compression set this variable to any value other than 1
        #                 This variable defaults to 1
        #                 Note : You can find out what compression is being used by the ramdisk by unpacking the vendor_boot image using magiskboot
        # - PRE_VENDOR_BOOT_MKBOOTIMG_CMDS : commands to be executed before running mkbootimg to create vendor_boot image
        #                        Example use case : Overriding mkbootimg args
        #                        How to use : export a function in the BUILD_CONFIG, set PRE_VENDOR_BOOT_MKBOOTIMG_CMDS
        #                                     to that function name
        # - POST_VENDOR_BOOT_MKBOOTIMG_CMDS : commands to be executed after running mkbootimg to create vendor_boot image
        #                        Example use case : sign vendor_boot images with custom keys (must set AVB_SIGN_VENDOR_BOOT_IMG=0 )
        #                        How to use : export a function in the BUILD_CONFIG, set POST_VENDOR_BOOT_MKBOOTIMG_CMDS
        #                                     to that function name
        # - VENDOR_BOOT_EXTRA_CMDS : Extra commands to be executed for device specific needs
        #                            How to use : export a function in the BUILD_CONFIG, set VENDOR_BOOT_EXTRA_CMDS
        #                                             to that function name
        # - VENDOR_BOOT_MKBOOTIMG_ARGS : Arguments for creating vendor boot image, if left empty build assumes generic v4 args
        # - AVB_SIGN_VENDOR_BOOT_CMDS : commands to be executed to sign the vendor_boot image
        #                        vendor_boot.img is placed inside ${OUT} dir
        #                        How to use: define a function to sign the vendor_boot image
        #                                    then set AVB_SIGN_VENDOR_BOOT_CMDS to that function name
        # - AVB_SIGN_VENDOR_BOOT_IMG : If set to 1, sign vendor_boot image (default) else skip
        # - AVB_SIGN_VENDOR_BOOT_ALGO : Defines vendor_boot image signing algorithm (defaults to sha256_rsa4096)
        # - AVB_SIGN_VENDOR_BOOT_KEY : Stores absolute path to the custom vendor_boot signing key (defaults to gki test keys)
        # - VENDOR_DLKM_EXTRA_CMDS : Extra commands to be executed for device specific needs
        #                            How to use : export a function in the BUILD_CONFIG, set VENDOR_DLKM_EXTRA_CMDS
        #                                             to that function name
        # - VENDOR_DLKM_EXTRA_FILES : When defined a custom defined function can be evaluated to decide which file(s)
        #                             goes into the dlkm partition. BUILD_CONFIG can use VENDOR_DLKM_STAGING_DIR
        #                             as root directory of the vendor_dlkm partition
        #                             Example use case : copy device specific files from ${PREBUILTS} dir to dlkm partition 
        #                             How to use : export a function in the BUILD_CONFIG, set VENDOR_DLKM_EXTRA_FILES
        #                                          to that function name
        # - VENDOR_DLKM_PROPS_FILE : Can store a path to custom props file which is not present in ${PREBUILTS} dir
        #                            Example use case : Use a props file already defined somewhere else (e.g KERNEL_DIR)
        #                            How to use : define VENDOR_DLKM_PROPS_FILE with absolute path of the props file
        #                            Note :  If vendor_dlkm.prop is present in the ${PREBUILTS} directory then it will get the highest priority
        if [[ -f "${BUILD_CONFIG}" ]]; then
          echo "::debug::Inheriting build config: ${BUILD_CONFIG}"
          set -a
            . ${BUILD_CONFIG}
          set +a
        fi

        if [[ -d "$KERNEL_PLATFORM/build/build-tools/path" ]]; then
          export PATH="$KERNEL_PLATFORM/build/build-tools/path/linux-x86:$PATH"
        else
          export PATH="$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin:$PATH"
        fi

        if [[ "${{ inputs.lto }}" = "thin" ]]; then
        (
          cd "${KERNEL_DIR}"
          echo '#!/bin/bash' > ld-wrapper
          echo 'ld.lld "$@" --thinlto-cache-dir=$LDCACHE_DIR --thinlto-jobs=$(nproc --all)' >> ld-wrapper
          chmod +x ld-wrapper
        )
          LD="${ROOT_DIR}/${KERNEL_DIR}/ld-wrapper"
        else
          LD="ld.lld"
        fi

        if [[ -f "$KERNEL_PLATFORM/build/build-tools/path/linux-x86/dtc" ]]; then
          DTC="$KERNEL_PLATFORM/build/kernel/build-tools/path/linux-x86/dtc"
        elif [[ -f "$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin/dtc" ]]; then
          DTC="$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin/dtc"
        else
          DTC="dtc"
        fi

        # Allow build.config to override MAKE_FLAGS
        if [[ ! -v MAKE_FLAGS ]]; then
          MAKE_FLAGS+=(
            LLVM=1
            LLVM_IAS=1
            ARCH=arm64
            CROSS_COMPILE="aarch64-linux-gnu-"
            LD="${LD}"
            DTC="${DTC}"
            DTC_FLAGS="-@"
            HOSTCC="ccache clang"
            HOSTCXX="ccache clang++"
            CC="ccache clang"
          )
        fi

        if [[ "$BUILD_TYPE" == "Mixed Build" || "$BUILD_TYPE" == "Modules Only" ]]; then
          MAKE_FLAGS+=(
            KBUILD_MIXED_TREE="$KBUILD_MIXED_TREE_DIR"
          )
        fi

        OUT=out
        INSTALL_MOD_PATH="${ROOT_DIR}/${KERNEL_DIR}/$OUT"
        INSTALL_DTBS_PATH="${ROOT_DIR}/${KERNEL_DIR}/$OUT/dtbs_staging"
        export MSM_ARCH="${SOC}"
        DTB_TYPES="${MSM_ARCH}-overlays-"

        mkdir -p "$OUT"

        # Allow build.config to override primary defconfig
        if [[ ! -v CONFIGS ]]; then
          CONFIGS=("gki_defconfig")

          # Merge defconfig fragments
          if [[ -f "${KERNEL_DIR}/arch/arm64/configs/vendor/${CODENAME}_GKI.config" ]]; then
            CONFIGS+=("vendor/${CODENAME}_GKI.config")
          elif [[ -f "${KERNEL_DIR}/arch/arm64/configs/vendor/${SOC}_GKI.config" ]]; then
            CONFIGS+=("vendor/${SOC}_GKI.config")
          fi

          if [[ -f "${KERNEL_DIR}/arch/arm64/configs/vendor/oplus/${SOC}_GKI.config" ]]; then
            CONFIGS+=("vendor/oplus/${SOC}_GKI.config")
          fi

          if [[ -f "${KERNEL_DIR}/arch/arm64/configs/vendor/debugfs.config" ]]; then
            CONFIGS+=("vendor/debugfs.config")
          fi

          if [[ "$BUILD_TYPE" == "Monolithic Build" ]]; then
            CONFIGS+=("kernel.config")
          fi
        fi

        CONFIGS+=("modules.config")
        declare -a MAKE_FLAGS_EXTRA=()

        (
          set -x
          cd "${KERNEL_DIR}"

          if [[ -n "${PRE_DEFCONFIG_CMDS:-}" ]]; then
            echo -e "::debug::Evaluating PRE_DEFCONFIG_CMDS inside $(pwd)"
            eval "${PRE_DEFCONFIG_CMDS}"
          fi

          make clean
          make "${MAKE_FLAGS[@]}" "${MAKE_FLAGS_EXTRA[@]}" O="$OUT" "${CONFIGS[@]}"

          if [[ -n "${POST_DEFCONFIG_CMDS:-}" ]]; then
            echo -e "::debug::Evaluating POST_DEFCONFIG_CMDS inside $(pwd)"
            eval "${POST_DEFCONFIG_CMDS}"
          fi

          # snapshot the merged defconfig for debugging
          make ARCH=arm64 O="$OUT" savedefconfig
          mv "$OUT/defconfig" "$ARTIFACTS_DIR_DEBUG/merged_defconfig"

          SECONDS=0

          echo "Building kernel modules and dtbs..."
          make "${MAKE_FLAGS[@]}" O=$OUT olddefconfig

          make -j$(nproc --all) "${MAKE_FLAGS[@]}" "${MAKE_FLAGS_EXTRA[@]}" O="$OUT" modules dtbs

          make -j$(nproc --all) "${MAKE_FLAGS[@]}" "${MAKE_FLAGS_EXTRA[@]}" O="$OUT" INSTALL_MOD_STRIP=1 INSTALL_MOD_PATH="$INSTALL_MOD_PATH" modules_install
          make -j$(nproc --all) "${MAKE_FLAGS[@]}" "${MAKE_FLAGS_EXTRA[@]}" O="$OUT" INSTALL_DTBS_PATH="$INSTALL_DTBS_PATH" DTB_TYPES="$DTB_TYPES" dtbs_install

          set +x
        )

        echo "duration=$SECONDS" >> "$GITHUB_ENV"

        # Exports for external kernel modules
        export BOARD_PLATFORM=kalama
        export TARGET_BOARD_PLATFORM=kalama

        # LOS sources expect out to be inside kernel_platform so we set out_dir as . 
        # because our actual out dir is inside common directory
        if [[ "$BUILD_TYPE" == "Monolithic Build" ]]; then
          export OUT_DIR=${MSM}
        fi

        export MODNAME=audio_dlkm
        export OPLUS_ARCH_EXTENDS=y
        export KERNEL_BUILD=0

        MAKE_FLAGS+=(
          KERNEL_SRC="${ROOT_DIR}/${KERNEL_DIR}"
        )

        if [[ -f "$KERNEL_PLATFORM/oplus/config/modules.ext.$KERNEL_VER.oplus" ]]; then
          # OPLUS ext modules list
          EXT_OPLUS=($(cat "$KERNEL_PLATFORM/oplus/config/modules.ext.$KERNEL_VER.oplus"))

          OPLUS_FLAGS+=(
              CHIPSET_COMPANY=QCOM
              OPLUS_VND_BUILD_PLATFORM="$SOC"
          )

          echo "Compiling vendor modules (oplus)"
          SECONDS=0

          # OPLUS ext modules
          set -x
          for MODULE in "${EXT_OPLUS[@]}"; do
              make -C "$MODULE" M="../$MODULE" -j$(nproc --all) "${MAKE_FLAGS[@]}" "${MAKE_FLAGS_EXTRA[@]}" O=$MSM/out "${OPLUS_FLAGS[@]}"
              make -C "$MODULE" M="../$MODULE" -j$(nproc --all) "${MAKE_FLAGS[@]}" "${MAKE_FLAGS_EXTRA[@]}" O=$MSM/out "${OPLUS_FLAGS[@]}" INSTALL_MOD_STRIP=1 INSTALL_MOD_PATH=$INSTALL_MOD_PATH modules_install
          done
          set +x

          echo "duration_oplus_ext=$SECONDS" >> "$GITHUB_ENV"
        else
          echo "::note::OPLUS modules not found. skipping"
          echo "duration_oplus_ext=0" >> "$GITHUB_ENV"
        fi

        # External modules (only qcom is added)
        # Allow build.config to override EXT_MODULES list
        if [[ ! -v EXT_MODULES ]]; then
          EXT_MODULES+=(
            ../vendor/qcom/opensource/mmrm-driver
            ../vendor/qcom/opensource/mm-drivers/hw_fence
            ../vendor/qcom/opensource/mm-drivers/sync_fence
            ../vendor/qcom/opensource/mm-drivers/msm_ext_display
            ../vendor/qcom/opensource/securemsm-kernel
            ../vendor/qcom/opensource/display-drivers/msm
            ../vendor/qcom/opensource/audio-kernel
            ../vendor/qcom/opensource/camera-kernel
            ../vendor/oplus/kernel/explorer
            ../vendor/qcom/opensource/video-driver
            ../vendor/qcom/opensource/graphics-kernel
            ../vendor/qcom/opensource/dataipa/drivers/platform/msm
            ../vendor/qcom/opensource/datarmnet/core
            ../vendor/qcom/opensource/datarmnet-ext/aps
            ../vendor/qcom/opensource/datarmnet-ext/offload
            ../vendor/qcom/opensource/datarmnet-ext/shs
            ../vendor/qcom/opensource/datarmnet-ext/sch
            ../vendor/qcom/opensource/datarmnet-ext/perf
            ../vendor/qcom/opensource/datarmnet-ext/perf_tether
            ../vendor/qcom/opensource/datarmnet-ext/wlan
            ../vendor/qcom/opensource/eva-kernel
            ../vendor/qcom/opensource/wlan/platform
            ../vendor/qcom/opensource/bt-kernel
            ../vendor/nxp/opensource/driver
            ../vendor/st/opensource/driver
            ../vendor/st/opensource/eSE-driver
            ../vendor/qcom/opensource/wlan/qcacld-3.0/.${QCACLD_DEV_NAME}
          )
        fi

        if [[ "$BUILD_TYPE" == "Mixed Build" || "$BUILD_TYPE" == "Modules Only" ]]; then
          export KBUILD_EXTRA_SYMBOLS=""
        fi

        echo "Compiling vendor modules (qcom)"
        SECONDS=0

        set -x
        for MODULE in "${EXT_MODULES[@]}"; do
            if [[ ! -d "$MODULE" ]]; then
              echo "::warning::The following module path does not exist : $MODULE"
              continue
            fi

            make -C "$MODULE" M="../$MODULE" -j$(nproc --all) "${MAKE_FLAGS[@]}" "${MAKE_FLAGS_EXTRA[@]}" O=$MSM/out "${OPLUS_FLAGS[@]}"
            make -C "$MODULE" M="../$MODULE" -j$(nproc --all) "${MAKE_FLAGS[@]}" "${MAKE_FLAGS_EXTRA[@]}" O=$MSM/out "${OPLUS_FLAGS[@]}" INSTALL_MOD_STRIP=1 INSTALL_MOD_PATH="$INSTALL_MOD_PATH" modules_install
            
            if [[ "$BUILD_TYPE" == "Mixed Build" || "$BUILD_TYPE" == "Modules Only" ]]; then
              export KBUILD_EXTRA_SYMBOLS=$(find "$KERNEL_PLATFORM/vendor" -name "Module.symvers" | tr '\n' ' ')
            fi
        done

        find "${INSTALL_MOD_PATH}" -name "${QCACLD_DEV_NAME}.ko" -execdir mv -i -- "{}" "qca_cld3_${QCACLD_DEV_NAME}.ko" \;
        set +x

        echo "duration_qcom_ext=$SECONDS" >> "$GITHUB_ENV"

        echo "Compiling vendor devicetree overlays"
        SECONDS=0

        set -x
        for PROJECT in $(cd "${CONFIG}" && find -L vendor/ -maxdepth 4 -type d -name "*-devicetree"); do
          if [[ ! -e "../${PROJECT}/Makefile" ]]; then
            echo "$PROJECT does not have expected build configuration files, skipping..."
            continue
          fi
          make -C "../${PROJECT}" M="../../${PROJECT}" -j$(nproc --all) "${MAKE_FLAGS[@]}" "${MAKE_FLAGS_EXTRA[@]}" O=$MSM/out "${OPLUS_FLAGS[@]}"
        done
        set +x

        echo "duration_dtb_ext=$SECONDS" >> "$GITHUB_ENV"

        # To be used for preparing modules.order in create_vendor_dlkm step
        EXT_MODULES=("${EXT_OPLUS[@]#../}" "${EXT_MODULES[@]#../}") >> "$GITHUB_ENV"

        # Build is done now set OUT to absolute path for performing file operations in that dir
        OUT="${ROOT_DIR}/${KERNEL_DIR}/out"

        cp "$OUT/Module.symvers" "$ARTIFACTS_DIR_DEBUG" || true
        cp "$OUT/.config" "$ARTIFACTS_DIR_DEBUG/config" || true
        cp "$OUT/include/config/auto.conf" "$ARTIFACTS_DIR_DEBUG/auto.conf" || true

        # snapshot the final defconfig for debugging
        ( cd ${KERNEL_DIR} && make "${MAKE_FLAGS[@]}" "${MAKE_FLAGS_EXTRA[@]}" O="$OUT" savedefconfig )
        mv "$OUT/defconfig" "$ARTIFACTS_DIR_DEBUG/final_defconfig"
        find "${OUT}" -type f -name '*.ko' -printf '%f\n' > ${ARTIFACTS_DIR_DEBUG}/device_modules.txt

    - name: Create dtb.img
      id: create_dtb
      if: ${{ inputs.compile_dlkm == 'true' }}
      shell: bash
      run: |
        OUT="${MSM}/out"
        PREBUILTS="${KERNEL_PATCHES}/device/${CODENAME}-${OS_SHORT}/vendor_boot"
        if [[ -f "${PREBUILTS}/dtb" ]]; then
          echo "Using dtb from prebuilts."
          cp "${PREBUILTS}/dtb" "${OUT}/dtb.img"
        else
          echo "::warning:: dtb not found from prebuilts"
          DTB_FILE_LIST=$(find "${OUT}/dtbs_staging" -name "*.dtb" | sort)
          cat $DTB_FILE_LIST > "${OUT}/dtb.img"
        fi

        tar -czf "${OUT}/dtbs_staging_archive.tar.gz" -C "${OUT}/dtbs_staging" .
        cp "${OUT}/dtbs_staging_archive.tar.gz" "${ARTIFACTS_DIR_DEBUG}"

    - name: Create system_dlkm Image
      if: ${{ inputs.compile_dlkm == 'true'  && env.BUILD_TYPE == 'Monolithic Build' }}
      id: create_system_dlkm
      shell: bash
      run: |
        PREBUILTS="${KERNEL_PATCHES}/device/${CODENAME}-${OS_SHORT}/system_dlkm"
        OUT="${COMMON}/out"
        UNAME=$(ls "${OUT}/lib/modules/")
        SYSTEM_DLKM_STAGING_DIR="${OUT}/system_dlkm_staging"
        SYSTEM_DLKM_STAGING_ROOT="${SYSTEM_DLKM_STAGING_DIR}/lib/modules/${UNAME}"
        # Add for Monolithic Trees
        DEPMOD_DIR="${SYSTEM_DLKM_STAGING_DIR}"
        DEPMOD_DIR_ROOT="${SYSTEM_DLKM_STAGING_DIR}/lib/modules/${UNAME}"

        if [[ -d "${KERNEL_PLATFORM}/build/build-tools/path" ]]; then
          export PATH="${KERNEL_PLATFORM}/build/build-tools/path/linux-x86:$PATH"
        else
          export PATH="${KERNEL_PLATFORM}/prebuilts/kernel-build-tools/linux-x86/bin:$PATH"
        fi

        if [[ -f "${BUILD_CONFIG}" ]]; then
          echo "::debug::Inheriting build config: ${BUILD_CONFIG}"
          set -a
            . ${BUILD_CONFIG}
          set +a
        fi

        # Don't create SYSTEM_DLKM_STAGING_DIR and copy the OUT/lib folder cause it has many unnecessary files
        # Instead create lib and copy modules folder from OUT/lib/modules to SYSTEM_DLKM_STAGING_DIR/lib/
        mkdir -p "${SYSTEM_DLKM_STAGING_DIR}/lib"

        # copy modules and other files generated by depmod to staging dir
        if [[ "${BUILD_TYPE}" == "Mixed Build" ]]; then
          cp -a "${OUT}/lib/modules" "${SYSTEM_DLKM_STAGING_DIR}/lib/"
        else
          # Since we build all the modules at once in monolithic trees which includes modules that goto into vendor_boot
          # ramdisk, vendor_dlkm & system_dlkm, we need to filter what modules goes into system_dlkm
          #
          # In mixed tree, we don't have the headache since all the modules built from gki-kernel goes into the
          # system_dlkm partition.
          if [[ ! -f "${PREBUILTS}/system_dlkm.modules.include ]]; then
            echo "::error:: system_dlkm.modules.include file is missing"
            exit 1
          fi

          # copy modules to DEPMOD_DIR_ROOT
          # NOTE: do depmod from DEPMOD_DIR
          cd "${OUT}/lib/modules/${UNAME}"
          missing_modules=$(mktemp)
          while IFS= read -r module || [[ -n "${module}" ]]; do
            module_path=$(find . -name "${module}" -print -quit)
            if [[ -n "${module_path}" ]]; then
              # use --parents flag bcoz system_dlkm is not flattened
              cp --parents "${module_path}" "${DEPMOD_DIR_ROOT}"
            else
              echo "::warning:: ${module} not found"
              echo "${module}" >> "${missing_modules}"
            fi
          done < "${PREBUILTS}/system_dlkm.modules.include"

          if [[ -s "${missing_modules}" ]]; then
            echo "::error:: The following system_dlkm modules are missing :"
            echo "$(cat "${missing_modules}")"
            echo "Stopping build!"
            exit 1
          fi

          cd "${DEPMOD_DIR}"
          echo "::note:: Performing depmod"
          depmod -F "${OUT}/System.map" -b . "${UNAME}"
        fi

        if [[ -f "${PREBUILTS}/system_dlkm.modules.load" ]]; then
          cp "${PREBUILTS}/system_dlkm.modules.load" "${SYSTEM_DLKM_STAGING_ROOT}/modules.load"
        else
          cp "${SYSTEM_DLKM_STAGING_ROOT}/modules.order" "${SYSTEM_DLKM_STAGING_ROOT}/modules.load"
        fi
        cp "${SYSTEM_DLKM_STAGING_ROOT}/modules.load" "${OUT}/system_dlkm.modules.load"

        # remove unnecessary files from SYSTEM_DLKM_STAGING_ROOT
        cd "${SYSTEM_DLKM_STAGING_ROOT}"
        rm build source || true

        # Extra cmds for device specific needs
        if [[ -v SYSTEM_DLKM_EXTRA_CMDS ]]; then
          echo -e "::debug::Evaluating SYSTEM_DLKM_EXTRA_CMDS inside $(pwd)"
          set -x
          eval "${SYSTEM_DLKM_EXTRA_CMDS}"
          set +x
        fi

        # Add other files found in stock system_dlkm
        # Allow build.config to define what goes into system_dlkm
        if [[ ! -v SYSTEM_DLKM_EXTRA_FILES ]]; then
          mkdir -p "${SYSTEM_DLKM_STAGING_DIR}/etc"
          if [[ -d "${PREBUILTS}/etc" ]]; then
            cp "${PREBUILTS}/etc"/* "${SYSTEM_DLKM_STAGING_DIR}/etc/"
            touch "${SYSTEM_DLKM_STAGING_DIR}/etc/fs_config_dirs" "${SYSTEM_DLKM_STAGING_DIR}/etc/fs_config_files"
          fi
        else
          echo -e "::debug::Evaluating SYSTEM_DLKM_EXTRA_FILES inside $(pwd)"
          set -x
          eval "${SYSTEM_DLKM_EXTRA_FILES}"
          set +x
        fi

        # Create temporary prop file for system_dlkm image
        system_dlkm_props_file="$(mktemp)"

        # Allow build.config to introduce custom system_dlkm props file
        if [[ -f "${PREBUILTS}/system_dlkm.prop" ]]; then
          echo -e "::debug::Using custom system_dlkm prop file with props:\n$(cat "${PREBUILTS}/system_dlkm.prop")"
          cat "${PREBUILTS}/system_dlkm.prop" >> ${system_dlkm_props_file}
        else
          if [[ ! -v SYSTEM_DLKM_PROPS_FILE ]]; then
            echo "system_dlkm_fs_type=ext4" >> ${system_dlkm_props_file}
            echo "use_dynamic_partition_size=true" >> ${system_dlkm_props_file}
            echo "ext_mkuserimg=mkuserimg_mke2fs" >> ${system_dlkm_props_file}
            echo "ext4_share_dup_blocks=true" >> ${system_dlkm_props_file}
            # echo -e "partition_name=system_dlkm\n" >> ${system_dlkm_props_file}
            # echo -e "mount_point=system_dlkm\n" >> ${system_dlkm_props_file}
          else
            echo -e "::debug::Using custom system_dlkm prop file with props:\n$(cat "${SYSTEM_DLKM_PROPS_FILE}")"
            cat "${SYSTEM_DLKM_PROPS_FILE}" >> ${system_dlkm_props_file}
          fi
        fi

        # Handle no new line in EOF 
        [ -n "$(tail -c1 "${system_dlkm_props_file}")" ] && printf "\n" >> "${system_dlkm_props_file}"

        if [[ -f "${PREBUILTS}/system_dlkm.selinux.fc.txt" ]]; then
          echo "system_dlkm_selinux_fc=${PREBUILTS}/system_dlkm.selinux.fc.txt" >> ${system_dlkm_props_file}
        fi

        if [[ -f "${PREBUILTS}/system_dlkm.fs_config.txt" ]]; then
          echo "fs_config=${PREBUILTS}/system_dlkm.fs_config.txt" >> ${system_dlkm_props_file}
        fi

        echo -e "::debug::system_dlkm staging tree :\n$(tree "${SYSTEM_DLKM_STAGING_DIR}")" | tee "${ARTIFACTS_DIR_DEBUG}/system_dlkm.tree"
        echo -e "::debug::Final system_dlkm props file contents :\n$(cat "${system_dlkm_props_file}")" | tee "${ARTIFACTS_DIR_DEBUG}/system_dlkm.prop"

        echo "::note:: Building system_dlkm Image"
        set -x
        build_image "${SYSTEM_DLKM_STAGING_DIR}" "${system_dlkm_props_file}" "${OUT}/system_dlkm.img" /dev/null
        set +x

        echo "::note:: Adding hashtree footer using avbtool"
        avbtool add_hashtree_footer \
            --partition_name system_dlkm \
            --image "${OUT}/system_dlkm.img"

        echo -e "::debug::system_dlkm fc:"
        sudo mkdir -p /mnt/system_dlkm
        sudo mount -o loop,ro "${OUT}/system_dlkm.img" /mnt/system_dlkm
        find /mnt/system_dlkm -exec ls -Zd {} + | tee "${ARTIFACTS_DIR_DEBUG}/system_dlkm.fc" || true

        SYSTEM_DLKM_SHA256=$(sha256sum "${OUT}/system_dlkm.img" | cut -d' ' -f1)
        echo "system_dlkm_sha256=${SYSTEM_DLKM_SHA256:-ERROR}" >> "$GITHUB_OUTPUT"

        cp "${OUT}/system_dlkm.img" "${ARTIFACTS_DIR}"
        cp "${OUT}/system_dlkm.modules.load" "${ARTIFACTS_DIR}"
        cp "${OUT}/system_dlkm.modules.load" "${ARTIFACTS_DIR_DEBUG}"

        tar -czf "${OUT}/system_dlkm_archive.tar.gz" -C "${SYSTEM_DLKM_STAGING_DIR}" .
        cp "${OUT}/system_dlkm_archive.tar.gz" "${ARTIFACTS_DIR_DEBUG}"

    - name: Create vendor_boot
      id: create_vendor_boot
      if: ${{ inputs.compile_dlkm == 'true' }}
      shell: bash
      run: |
        PREBUILTS="${KERNEL_PATCHES}/device/${CODENAME}-${OS_SHORT}/vendor_boot"
        if [[ -f "$KERNEL_PLATFORM/tools/mkbootimg/mkbootimg.py" ]]; then
          MKBOOTIMG="$KERNEL_PLATFORM/tools/mkbootimg/mkbootimg.py"
        else
          MKBOOTIMG="mkbootimg"
        fi

        OUT="${MSM}/out"
        UNAME=$(ls "${OUT}/lib/modules/")
        MODULES_STAGING_ROOT="${OUT}/lib/modules/${UNAME}"
        VENDOR_BOOT_STAGING_DIR="${OUT}/vendor_boot_staging"
        RAMDISK_STAGING_DIR="${VENDOR_BOOT_STAGING_DIR}/ramdisk"
        RAMDISK_STAGING_MODULES="${RAMDISK_STAGING_DIR}/lib/modules"
        DEPMOD_DIR="${RAMDISK_STAGING_DIR}"
        # After depmod delete this dir since ramdisk is flattened
        DEPMOD_DIR_ROOT="${VENDOR_BOOT_STAGING_DIR}/ramdisk/lib/modules/${UNAME}"

        if [[ -d "${KERNEL_PLATFORM}/build/build-tools/path" ]]; then
          export PATH="${KERNEL_PLATFORM}/build/build-tools/path/linux-x86:$PATH"
        else
          export PATH="${KERNEL_PLATFORM}/prebuilts/kernel-build-tools/linux-x86/bin:$PATH"
        fi

        if [[ -f "${BUILD_CONFIG}" ]]; then
          echo "::debug::Inheriting build config: ${BUILD_CONFIG}"
          set -a
            . ${BUILD_CONFIG}
          set +a
        fi

        # Create folder of highest depth amongst all
        mkdir -p "${DEPMOD_DIR_ROOT}"

        # add prebuilt files
        cd "${RAMDISK_STAGING_MODULES}"

        shopt -s nullglob
        for file in "${PREBUILTS}"/vendor_boot.modules.*; do
          prebuilt_file=$(basename "$file")
          if [[ "${prebuilt_file}" == "vendor_boot.modules.include" ]]; then
            continue
          fi
          cp "$file" "${RAMDISK_STAGING_MODULES}/${prebuilt_file#vendor_boot.}"
        done
        shopt -u nullglob

        if [[ ! -f "${PREBUILTS}/vendor_boot.modules.include" ]]; then
          echo "::error:: vendor_boot.modules.include file not found in PREBUILTS folder! Stopping build"
          exit 1
        fi

        ramdisk_modules="${PREBUILTS}/vendor_boot.modules.include"
        # copy modules to DEPMOD_DIR_ROOT
        # NOTE: do depmod from DEPMOD_DIR
        cd "${MODULES_STAGING_ROOT}"
        missing_modules=$(mktemp)
        while IFS= read -r module || [[ -n "${module}" ]]; do
          module_path=$(find . -name "${module}" -print -quit)
          if [[ -n "${module_path}" ]]; then
            cp "${module_path}" "${DEPMOD_DIR_ROOT}"
          else
            if [[ -f "${PREBUILTS}/proprietary/${module}" ]]; then
              echo "::note:: Using ${module} from prebuilts."
              cp "${PREBUILTS}/proprietary/${module}" "${DEPMOD_DIR_ROOT}/${module}"
            else
              echo "::warning:: ${module} not found"
              echo "${module}" >> "${missing_modules}"
            fi
          fi
        done < "${ramdisk_modules}"

        if [[ -s "${missing_modules}" ]]; then
          echo "::error:: The following ramdisk modules are missing :"
          echo "$(cat "${missing_modules}")"
          echo "Stopping build!"
          exit 1
        fi

        # Apply depmod and copy required artifacts
        cd "${DEPMOD_DIR}"
        echo "::note:: Performing depmod"
        if [[ "${BUILD_TYPE}" == "Monolithic Build" ]]; then
          # During Monolithic Builds we don't perform mixed build so there's no KBUILD_MIXED_TREE
          # we use System.map from OUT dir instead
          depmod -F "${OUT}/System.map" -b . "${UNAME}"
        else
          depmod -F "${KBUILD_MIXED_TREE_DIR}/System.map" -b . "${UNAME}"
        fi
        cp -p "${DEPMOD_DIR_ROOT}"/modules.{alias,dep,softdep} "${RAMDISK_STAGING_MODULES}"

        # Copy modules from depmod dir root and delete the dir since vendor boot is flattened
        find "${DEPMOD_DIR_ROOT}" -type f -name '*.ko' -exec cp {} "${RAMDISK_STAGING_MODULES}/" \;
        rm -rf "${DEPMOD_DIR_ROOT}"

        # Add additional files that will go into ramdisk
        if [[ -d "${PREBUILTS}/first_stage_ramdisk" ]]; then
          mkdir -p "$RAMDISK_STAGING_DIR/first_stage_ramdisk"
          shopt -s nullglob
          cp "${PREBUILTS}/first_stage_ramdisk"/* "${RAMDISK_STAGING_DIR}/first_stage_ramdisk"
          shopt -u nullglob
        else
          echo "::warning:: first_stage_ramdisk folder is missing for vendor boot partition in PREBUILTS dir"
        fi

        if [[ -d "${PREBUILTS}/ramdisk" ]]; then
          shopt -s nullglob
          cp "${PREBUILTS}/ramdisk"/* "${RAMDISK_STAGING_DIR}/"
          shopt -u nullglob
        fi

        cd "${VENDOR_BOOT_STAGING_DIR}"

        # Create cpio compressed ramdisk using mkbootfs; use cpio like cyberknight777 did in his YAKB??
        MKBOOTIMG_RAMDISK_CPIO="${OUT}/ramdisk.cpio" 
        mkbootfs "${RAMDISK_STAGING_DIR}" > "${MKBOOTIMG_RAMDISK_CPIO}"

        # Compress ramdisk according to desired ramdisk compression
        LZ4_RAMDISK=${LZ4_RAMDISK:-1}
        if [[ "${LZ4_RAMDISK}" == "1" ]]; then
          RAMDISK_COMPRESS="lz4 -c -l ${LZ4_RAMDISK_COMPRESS_ARGS:--12 --favor-decSpeed}"
          RAMDISK_EXT="lz4"
        else
          RAMDISK_COMPRESS="gzip -c -f"
          RAMDISK_EXT="gz"
        fi
        ${RAMDISK_COMPRESS} "${MKBOOTIMG_RAMDISK_CPIO}" > "${OUT}/ramdisk.${RAMDISK_EXT}"

        if [[ -f "${PREBUILTS}/bootconfig" ]]; then
          cat "${PREBUILTS}/bootconfig" > "${OUT}/vendor-bootconfig.img"
        else
          echo "::warning:: bootconfig is missing !"
        fi

        # Note : prebuilt vendor cmdline already contains bootconfig , so no need to append it!
        if [[ -f "${PREBUILTS}/cmdline.txt" ]]; then
          VENDOR_CMDLINE=$(cat "${PREBUILTS}/cmdline.txt")
        else
          echo "::warning:: cmdline is missing !"
        fi
       
        if [ -n "${PRE_VENDOR_BOOT_MKBOOTIMG_CMDS:-}" ]; then
          echo -e "::debug::Evaluating PRE_VENDOR_BOOT_MKBOOTIMG_CMDS inside $(pwd)"
          set -x
          eval "${PRE_VENDOR_BOOT_MKBOOTIMG_CMDS}"
          set +x
        fi

        # Extra cmds for device specific needs
        if [ -n "${VENDOR_BOOT_EXTRA_CMDS:-}" ]; then
          echo -e "::debug::Evaluating VENDOR_BOOT_EXTRA_CMDS inside $(pwd)"
          set -x
          eval "${VENDOR_BOOT_EXTRA_CMDS}"
          set +x
        fi

        # Allow build.config files to override generic v4 no ramdisk mkbootimg flags
        if [[ ! -v VENDOR_BOOT_MKBOOTIMG_ARGS ]]; then
          VENDOR_BOOT_MKBOOTIMG_ARGS=(
            "--header_version" "4"
            "--pagesize" "4096"
            "--vendor_cmdline" "${VENDOR_CMDLINE}"
            "--dtb" "${OUT}/dtb.img"
            "--vendor_bootconfig" "${OUT}/vendor-bootconfig.img"
            "--vendor_boot" "${OUT}/vendor_boot.img"
            "--vendor_ramdisk" "${OUT}/ramdisk.${RAMDISK_EXT}"
          )
        fi

        echo -e "::debug::vendor_boot staging tree :\n$(tree "${VENDOR_BOOT_STAGING_DIR}")" | tee "${ARTIFACTS_DIR_DEBUG}/vendor_boot.tree"

        echo "::note:: Creating vendor boot image"
        set -x
        "${MKBOOTIMG}" "${VENDOR_BOOT_MKBOOTIMG_ARGS[@]}"
        set +x

        if [ -n "${POST_VENDOR_BOOT_MKBOOTIMG_CMDS:-}" ]; then
          echo -e "::debug::Evaluating POST_VENDOR_BOOT_MKBOOTIMG_CMDS inside $(pwd)"
          set -x
          eval "${POST_VENDOR_BOOT_MKBOOTIMG_CMDS}"
          set +x
        fi

        # Allow build.config to sign vendor_boot images using custom algo and keys
        if [[ -n "${AVB_SIGN_VENDOR_BOOT_CMDS:-}" ]]; then
          echo "Signing vendor_boot image"
          echo -e "::debug::Evaluating AVB_SIGN_VENDOR_BOOT_CMDS inside $(pwd)"
          set -x
          eval "${AVB_SIGN_VENDOR_BOOT_CMDS}"
          set +x
        elif [[ "${AVB_SIGN_VENDOR_BOOT_IMG:-1}" == "1" ]]; then
          # Allow build.config to override vendor_boot image signing
          # Users have three choices : - sign manually using their own keys
          #                            - sign using test keys
          #                            - don't sign at all
          echo "Signing vendor_boot image"

          # Allow build.config to ovveride default signing algorithm and vendor_boot signing key
          set -x
          AVB_SIGN_VENDOR_BOOT_ALGO=${AVB_SIGN_VENDOR_BOOT_ALGO:-SHA256_RSA4096}
          AVB_SIGN_VENDOR_BOOT_KEY=${AVB_SIGN_VENDOR_BOOT_KEY:-${KERNEL_PLATFORM}/tools/mkbootimg/gki/testdata/testkey_rsa4096.pem}

          avbtool add_hash_footer \
            --partition_name vendor_boot \
            --partition_size "${VENDOR_BOOT_PARTITION_SIZE}" \
            --image "${OUT}/vendor_boot.img" \
            --algorithm "${AVB_SIGN_VENDOR_BOOT_ALGO}" \
            --key "${AVB_SIGN_VENDOR_BOOT_KEY}"
          set +x
        fi

        VENDOR_BOOT_SHA256=$(sha256sum "${OUT}/vendor_boot.img" | cut -d' ' -f1)
        echo "vendor_boot_sha256=${VENDOR_BOOT_SHA256:-ERROR}" >> "$GITHUB_OUTPUT"

        cp "${RAMDISK_STAGING_MODULES}/modules.load" "${OUT}/vendor_boot.modules.load"
        cp "${RAMDISK_STAGING_MODULES}/modules.load.recovery" "${OUT}/vendor_boot.modules.load.recovery"

        cp "${OUT}/vendor_boot.img" "${ARTIFACTS_DIR}"
        cp "${OUT}/vendor_boot.modules.load" "${ARTIFACTS_DIR}"
        cp "${OUT}/vendor_boot.modules.load" "${ARTIFACTS_DIR_DEBUG}"
        cp "${OUT}/vendor_boot.modules.load.recovery" "${ARTIFACTS_DIR}"
        cp "${OUT}/vendor_boot.modules.load.recovery" "${ARTIFACTS_DIR_DEBUG}"
        cp "${OUT}/ramdisk.cpio" "${ARTIFACTS_DIR_DEBUG}"
        cp "${OUT}/vendor-bootconfig.img" "${ARTIFACTS_DIR_DEBUG}"

        tar -czf "${OUT}/vendor_boot_archive.tar.gz" -C "${VENDOR_BOOT_STAGING_DIR}" .
        cp "${OUT}/vendor_boot_archive.tar.gz" "${ARTIFACTS_DIR_DEBUG}"

    - name: Create vendor_dlkm
      id: create_vendor_dlkm
      if: ${{ inputs.compile_dlkm == 'true' }}
      shell: bash
      run: |
        PREBUILTS="${KERNEL_PATCHES}/device/${CODENAME}-${OS_SHORT}/vendor_dlkm"
        OUT="${MSM}/out"
        UNAME=$(ls "${OUT}/lib/modules/")
        MODULES_STAGING_ROOT="${OUT}/lib/modules/$UNAME"
        VENDOR_DLKM_STAGING_DIR="${OUT}/vendor_dlkm_staging"
        VENDOR_DLKM_STAGING_ROOT="${VENDOR_DLKM_STAGING_DIR}/lib/modules"
        DEPMOD_DIR="${VENDOR_DLKM_STAGING_DIR}"
        # After depmod delete this dir since vendor_dlkm is flattened
        DEPMOD_DIR_ROOT="${VENDOR_DLKM_STAGING_DIR}/lib/modules/${UNAME}"

        if [[ -d "${KERNEL_PLATFORM}/build/build-tools/path" ]]; then
          export PATH="${KERNEL_PLATFORM}/build/build-tools/path/linux-x86:$PATH"
        else
          export PATH="${KERNEL_PLATFORM}/prebuilts/kernel-build-tools/linux-x86/bin:$PATH"
        fi

        if [[ -f "${BUILD_CONFIG}" ]]; then
          echo "::debug::Inheriting build config: ${BUILD_CONFIG}"
          set -a
            . ${BUILD_CONFIG}
          set +a
        fi

        # Create folder of highest depth amongst all
        mkdir -p "${DEPMOD_DIR_ROOT}"

        # add prebuilt files
        cd "${VENDOR_DLKM_STAGING_ROOT}"

        shopt -s nullglob
        for file in "${PREBUILTS}"/vendor_dlkm.modules.*; do
          prebuilt_file=$(basename "$file")
          if [[ "${prebuilt_file}" == "vendor_dlkm.modules.include" ]]; then
            continue
          fi
          cp "$file" "${VENDOR_DLKM_STAGING_ROOT}/${prebuilt_file#vendor_dlkm.}"
        done
        shopt -u nullglob

        if [[ ! -f "${PREBUILTS}/vendor_dlkm.modules.include" ]]; then
          echo "::error:: vendor_dlkm.modules.include not found !"
          exit 1
        fi

        if [[ -f "${PREBUILTS}/system_dlkm.modules.blocklist" ]]; then
          cp "${PREBUILTS}/system_dlkm.modules.blocklist" "${VENDOR_DLKM_STAGING_ROOT}"
        fi

        # copy modules to DEPMOD_DIR_ROOT
        # NOTE: do depmod from DEPMOD_DIR
        cd "${MODULES_STAGING_ROOT}"
        missing_modules=$(mktemp)
        while IFS= read -r module || [[ -n "${module}" ]]; do
          module_path=$(find . -name "${module}" -print -quit)
          if [[ -n "${module_path}" ]]; then
            cp "${module_path}" "${DEPMOD_DIR_ROOT}"
          else
            if [[ -f "${PREBUILTS}/proprietary/${module}" ]]; then
              echo "::note:: Using ${module} from prebuilts."
              cp "${PREBUILTS}/proprietary/${module}" "${DEPMOD_DIR_ROOT}/${module}"
            else
              echo "::warning:: ${module} not found"
              echo "${module}" >> "${missing_modules}"
            fi
          fi
        done < "${PREBUILTS}/vendor_dlkm.modules.include"

        if [[ -s "${missing_modules}" ]]; then
          echo "::error:: The following ramdisk modules are missing :"
          echo "$(cat "${missing_modules}")"
          echo "Stopping build!"
          exit 1
        fi

        # NOTE: modules.order is not present in stock_dlkm, this modules.order is strictly for debugging purposes only !
        modules_order="$(mktemp)"
        cat "${MODULES_STAGING_ROOT}/modules.order" >> "${modules_order}"
        # Append modules.order in the sequence we compiled them
        for MODULE in "${EXT_MODULES[@]}"; do
          find "${MODULES_STAGING_ROOT}/extra/${MODULE}" -type f -name 'modules.order*' -exec cat {} >> "${modules_order}" \;
        done
        sed -i 's/.*\///g' "${modules_order}"
        cp "${modules_order}" "${ARTIFACTS_DIR_DEBUG}/modules.order"

        # Apply depmod and copy required artifacts
        cd "${DEPMOD_DIR}"
        echo "::note:: Performing depmod"
        if [[ "${BUILD_TYPE}" == "Monolithic Build" ]]; then
          # During Monolithic Builds we don't perform mixed build so there's no KBUILD_MIXED_TREE
          # we use System.map from OUT dir instead
          depmod -F "${OUT}/System.map" -b . "${UNAME}"
        else
          depmod -F "${KBUILD_MIXED_TREE_DIR}/System.map" -b . "${UNAME}"
        fi
        cp -p "${DEPMOD_DIR_ROOT}"/modules.{alias,dep,softdep} "${VENDOR_DLKM_STAGING_ROOT}"

        # Copy modules from depmod dir and delete the dir since vendor dlkm is flattened
        find "${DEPMOD_DIR_ROOT}" -type f -name '*.ko' -exec cp {} "${VENDOR_DLKM_STAGING_ROOT}/" \;
        rm -rf "${DEPMOD_DIR_ROOT}"

        cp "${VENDOR_DLKM_STAGING_ROOT}/modules.load" "${OUT}/vendor_dlkm.modules.load"

        # Add other files found in stock vendor_dlkm
        # Allow build.config to define what goes into vendor_dlkm
        # VENDOR_DLKM_STAGING_DIR holds the root path of the dlkm partition
        if [[ ! -v VENDOR_DLKM_EXTRA_FILES ]]; then
          mkdir -p "${VENDOR_DLKM_STAGING_DIR}/etc"
          if [[ -d "${PREBUILTS}/etc" ]]; then
            cp "${PREBUILTS}/etc"/* "${VENDOR_DLKM_STAGING_DIR}/etc/"
            touch "${VENDOR_DLKM_STAGING_DIR}/etc/fs_config_dirs" "${VENDOR_DLKM_STAGING_DIR}/etc/fs_config_files"
          fi
        else
          echo -e "::debug::Evaluating VENDOR_DLKM_EXTRA_FILES inside $(pwd)"
          set -x
          eval "${VENDOR_DLKM_EXTRA_FILES}"
          set +x
        fi

        cd "${OUT}"
        # Create temporary prop file for vendor_dlkm image
        vendor_dlkm_props_file="$(mktemp)"

        # Allow build.config to introduce custom vendor_dlkm props file
        if [[ -f "${PREBUILTS}/vendor_dlkm.prop" ]]; then
          echo -e "::debug::Using custom vendor_dlkm prop file with props:\n$(cat "${PREBUILTS}/vendor_dlkm.prop")"
          cat "${PREBUILTS}/vendor_dlkm.prop" >> ${vendor_dlkm_props_file}
        else
          if [[ ! -v VENDOR_DLKM_PROPS_FILE ]]; then
            echo "vendor_dlkm_fs_type=ext4" >> ${vendor_dlkm_props_file}
            echo "use_dynamic_partition_size=true" >> ${vendor_dlkm_props_file}
            echo "ext_mkuserimg=mkuserimg_mke2fs" >> ${vendor_dlkm_props_file}
            echo "ext4_share_dup_blocks=true" >> ${vendor_dlkm_props_file}
            # echo -e "mount_point=vendor_dlkm\n" >> ${vendor_dlkm_props_file}
          else
            echo -e "::debug::Using custom vendor_dlkm prop file with props:\n$(cat "${VENDOR_DLKM_PROPS_FILE}")"
            cat "${VENDOR_DLKM_PROPS_FILE}" >> ${vendor_dlkm_props_file}
          fi
        fi

        # Handle no new line in EOF 
        [ -n "$(tail -c1 "${vendor_dlkm_props_file}")" ] && printf "\n" >> "${vendor_dlkm_props_file}"

        if [[ -f "${PREBUILTS}/vendor_dlkm.selinux.fc.txt" ]]; then
          echo "vendor_dlkm_selinux_fc=${PREBUILTS}/vendor_dlkm.selinux.fc.txt" >> ${vendor_dlkm_props_file}
        fi

        if [[ -f "${PREBUILTS}/vendor_dlkm.fs_config.txt" ]]; then
          echo "fs_config=${PREBUILTS}/vendor_dlkm.fs_config.txt" >> ${vendor_dlkm_props_file}
        fi

        # Extra cmds for device specific needs
        if [[ -v VENDOR_DLKM_EXTRA_CMDS ]]; then
          echo -e "::debug::Evaluating VENDOR_DLKM_EXTRA_CMDS inside $(pwd)"
          set -x
          eval "${VENDOR_DLKM_EXTRA_CMDS}"
          set +x
        fi

        echo -e "::debug::vendor_dlkm staging tree :\n$(tree "${VENDOR_DLKM_STAGING_DIR}")" | tee "${ARTIFACTS_DIR_DEBUG}/vendor_dlkm.tree"
        echo -e "::debug::Final vendor_dlkm props file contents :\n$(cat "${vendor_dlkm_props_file}")" | tee "${ARTIFACTS_DIR_DEBUG}/vendor_dlkm.prop"

        echo "::note:: Building vendor_dlkm Image"
        set -x
        build_image "${VENDOR_DLKM_STAGING_DIR}" "${vendor_dlkm_props_file}" "${OUT}/vendor_dlkm.img" /dev/null
        set +x

        echo -e "::debug::vendor_dlkm fc:"
        sudo mkdir -p /mnt/vendor_dlkm
        sudo mount -o loop,ro "${OUT}/vendor_dlkm.img" /mnt/vendor_dlkm
        find /mnt/vendor_dlkm -exec ls -Zd {} + | tee "${ARTIFACTS_DIR_DEBUG}/vendor_dlkm.fc" || true

        VENDOR_DLKM_SHA256=$(sha256sum "${OUT}/vendor_dlkm.img" | cut -d' ' -f1)
        echo "vendor_dlkm_sha256=${VENDOR_DLKM_SHA256:-ERROR}" >> "$GITHUB_OUTPUT"

        cp "${OUT}/vendor_dlkm.img" "${ARTIFACTS_DIR}"
        cp "${OUT}/vendor_dlkm.modules.load" "${ARTIFACTS_DIR}"
        cp "${OUT}/vendor_dlkm.modules.load" "${ARTIFACTS_DIR_DEBUG}"

        tar -czf "${OUT}/vendor_dlkm_archive.tar.gz" -C "${VENDOR_DLKM_STAGING_DIR}" .
        cp "${OUT}/vendor_dlkm_archive.tar.gz" "${ARTIFACTS_DIR_DEBUG}"

    - name: Filter modules
      shell: bash
      run: |
        set -euo pipefail
        OUT="$MSM/out"
        UNAME=$(ls "$OUT/lib/modules/")

        echo "Copying all modules to $OUT/modules"
        cd "$OUT"
        mkdir -p modules modules_debug
        find lib/modules/"$UNAME" -type f -name '*.ko' \
        -exec cp {} modules/ \; \
        -exec cp {} modules_debug/ \;

        echo "Total modules copied: $(find modules -type f -name '*.ko' | wc -l)"

        echo "Removing unnecessary modules..."
        cd modules
        # Download default module list
        curl -sL -o default_modules.txt https://raw.githubusercontent.com/nullptr-t-oss/kernel_patches/refs/heads/main/default_modules.txt
        # Remove modules in the default list

        while IFS= read -r module; do
          if [[ -e "$module" ]]; then
            rm -f "$module"
            echo "Removed module: $module"
          fi
        done < default_modules.txt
        cd ..
        echo "Modules remaining after filtering: $(find modules -type f -name '*.ko' | wc -l)"

    - name: Create Kernel Modules zip
      id: create_modules_zip
      shell: bash
      run: |
        set -euo pipefail
        OUT="$MSM/out"
        MODULES_SRC="$OUT/modules"
        MODULES_SRC_DEBUG="${OUT}/modules_debug"
        MODULES_ZIP="$CONFIG/artifacts/kernel_modules_${{ env.CODENAME }}.zip"
        MODULES_ZIP_DEBUG="${ARTIFACTS_DIR_DEBUG}/kernel_modules_${{ env.CODENAME }}_debug.zip"
        mkdir -p "$CONFIG/artifacts"
        find "$MODULES_SRC" -type f -name '*.ko' -print0 | xargs -0 zip -j "$MODULES_ZIP"
        echo "Packaged trimmed kernel modules to $MODULES_ZIP"

        mkdir -p "${ARTIFACTS_DIR_DEBUG}"
        find "${MODULES_SRC_DEBUG}" -type f -name '*.ko' -print0 | xargs -0 zip -j "${MODULES_ZIP_DEBUG}"
        echo "Packaged full kernel modules to ${MODULES_ZIP_DEBUG}"

        full_modules_count=$(find "${MODULES_SRC_DEBUG}" -type f -name '*.ko' | wc -l)
        echo "full_modules_count=${full_modules_count}" >> "$GITHUB_OUTPUT"

        echo "modules_zip_path=$MODULES_ZIP" >> "$GITHUB_OUTPUT"

    - name: Format build time
      id: build_time
      shell: bash
      run: |
        set -euo pipefail

        if [[ "$duration" -ge 60 ]]; then
          duration="$((duration / 60))m $((duration % 60))s"
        else
          duration="${duration}s"
        fi

        if [[ "$duration_oplus_ext" -ge 60 ]]; then
          duration_oplus_ext="$((duration_oplus_ext / 60))m $((duration_oplus_ext % 60))s"
        else
          duration_oplus_ext="${duration_oplus_ext}s"
        fi

        if [[ "$duration_qcom_ext" -ge 60 ]]; then
          duration_qcom_ext="$((duration_qcom_ext / 60))m $((duration_qcom_ext % 60))s"
        else
          duration_qcom_ext="${duration_qcom_ext}s"
        fi

        if [[ "$duration_dtb_ext" -ge 60 ]]; then
          duration_dtb_ext="$((duration_dtb_ext / 60))m $((duration_dtb_ext % 60))s"
        else
          duration_dtb_ext="${duration_dtb_ext}s"
        fi

        echo "duration=$duration" >> "$GITHUB_OUTPUT"
        echo "duration_oplus_ext=$duration_oplus_ext" >> "$GITHUB_OUTPUT"
        echo "duration_qcom_ext=$duration_qcom_ext" >> "$GITHUB_OUTPUT"
        echo "duration_dtb_ext=$duration_dtb_ext" >> "$GITHUB_OUTPUT"

    - name: Final Build Summary
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "### Kernel Modules Build Summary"
          echo "----"
          echo ""
          echo "> [!NOTE]"
          echo "> Model: ${{ env.PRODUCT }}"
          echo ""
          
          if [[ "${{ inputs.compile_dlkm }}" == "true" ]]; then
            echo "> [!IMPORTANT]"

            if [[ "${{ inputs.compile_dlkm }}" == "true" && "${{ env.BUILD_TYPE }}" == "Monolithic Build" ]]; then
              echo "> - System dlkm image SHA256: ${{ steps.create_system_dlkm.outputs.system_dlkm_sha256 }}"
            fi

            echo "> - Vendor boot SHA256: ${{ steps.create_vendor_boot.outputs.vendor_boot_sha256 }}"
            echo "> - Vendor dlkm SHA256: ${{ steps.create_vendor_dlkm.outputs.vendor_dlkm_sha256 }}"
          fi
          echo ""
          echo "> [!NOTE]"
          echo "> - Total modules built: ${{ steps.create_modules_zip.outputs.full_modules_count }}"
          echo "> - Modules build time: ${{ steps.build_time.outputs.duration }}"
          echo "> - Oplus external modules build time: ${{ steps.build_time.outputs.duration_oplus_ext }}"
          echo "> - Qcom external modules build time: ${{ steps.build_time.outputs.duration_qcom_ext }}"
          echo "> - External dtbo build time: ${{ steps.build_time.outputs.duration_dtb_ext }}"
          echo ""
          echo "> [!IMPORTANT]"
          echo "> ## CCache Statistics :"
          echo "> $(ccache -s -v )"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Cleanup old ccache & upload ccache log
      shell: bash
      run: |
        set -euo pipefail

        echo "[DEBUG] Uploading ccache logs"
        cp "$CCACHE_LOGFILE" "$ARTIFACTS_DIR_DEBUG"

        # Evict untouched ccache contents
        ccache_end=$(date +%s)
        ccache_delta=$(( ccache_end - ccache_start ))
        if [[ "${{ inputs.evict_unused_ccache }}" == "true" ]]; then
          echo "[DEBUG] Deleting ccache contents older than $ccache_delta seconds"
          ccache --evict-older-than "${ccache_delta}s"
        fi

        echo "::warning::Deleting old LTO cache"
        gh cache delete LTO-${{ env.CODENAME }}-${{ env.OS_SHORT }}-modules-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }} || true

        echo "::warning::Deleting old ccache"
        gh cache delete ccache-${{ env.CODENAME }}-${{ env.OS_SHORT }}-modules-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }} || true

    - name: Save ccache
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ env.CODENAME }}-${{ env.OS_SHORT }}-modules-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}-${{ inputs.lto }}_LTO

    - name: Save LTO cache
      if: ${{ inputs.lto == 'thin'}}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.LDCACHE_DIR }}
        key: LTO-${{ env.CODENAME }}-${{ env.OS_SHORT }}-modules-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}

    - name: Upload Kernel Modules zip
      if: success() && steps.create_modules_zip.conclusion == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: kernel-modules-${{ env.CODENAME }}-${{ env.OS_SHORT }}
        path: ${{ env.CONFIG }}/artifacts/

    - name: Upload modules artifacts
      if: ${{ inputs.tg_enabled == 'true' && success() && steps.create_modules_zip.conclusion == 'success' }}
      uses: ./.github/telegram
      with:
        bot_token: ${{ inputs.tg_bot_token }}
        chat_id: ${{ inputs.tg_chat_id }}
        thread_id: ${{ inputs.tg_thread_id }}
        api_base_url: ${{ inputs.tg_api_base }}
        mode: rich-with-file
        files: |
          ${{ steps.create_modules_zip.outputs.modules_zip_path }}
          ${{ env.ARTIFACTS_DIR }}/system_dlkm.img
          ${{ env.ARTIFACTS_DIR }}/vendor_dlkm.img
          ${{ env.ARTIFACTS_DIR }}/vendor_boot.img
        message: |
          # Kernel Modules

          | Model | ${{ env.PRODUCT }} |
          | ---- | ---- |
          | Total modules built | ${{ steps.create_modules_zip.outputs.full_modules_count }} |

    - name: Create debug artifacts for Telegram uploads
      id: tg_debug_zip
      if: ${{ inputs.tg_enabled == 'true' && inputs.tg_send_debug == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "$(ls -A "$ARTIFACTS_DIR_DEBUG" 2>/dev/null)" ]]; then
          echo "::warning::No debug artifacts found for msm/modules, skipping notify."
          echo "zip_path=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        DEBUG_ZIP="/tmp/debug-msm-${{ env.CODENAME }}-${{ env.OS_SHORT }}-${GITHUB_RUN_NUMBER}.zip"
        ( cd "$ARTIFACTS_DIR_DEBUG" && zip -r9 "$DEBUG_ZIP" ./* >/dev/null )
        echo "debug_zip_path=$DEBUG_ZIP" >> "$GITHUB_OUTPUT"

    - name: Upload debug artifacts
      if: ${{ inputs.tg_enabled == 'true' && inputs.tg_send_debug == 'true' && steps.tg_debug_zip.outputs.debug_zip_path != '' }}
      uses: ./.github/telegram
      with:
        bot_token: ${{ inputs.tg_bot_token }}
        chat_id: ${{ inputs.tg_chat_id }}
        thread_id: ${{ inputs.tg_thread_id }}
        api_base_url: ${{ inputs.tg_api_base }}
        mode: rich-with-file
        files: |
          ${{ env.ARTIFACTS_DIR_DEBUG }}/config
          ${{ steps.tg_debug_zip.outputs.debug_zip_path }}
        message: |
          # 🐛 Debug Artifacts (MSM)

          | Model | ${{ env.PRODUCT }} |
          | --- | --- |
          | Total modules built | ${{ steps.create_modules_zip.outputs.full_modules_count }} |
          | Modules build time | ${{ steps.build_time.outputs.duration }} |
          | Oplus external modules build time | ${{ steps.build_time.outputs.duration_oplus_ext }} |
          | Qcom external modules build time | ${{ steps.build_time.outputs.duration_qcom_ext }} |
          | External dtbo build time | ${{ steps.build_time.outputs.duration_dtb_ext }} |

    - name: Upload Debug zip
      uses: actions/upload-artifact@v4
      with:
        name: debug-msm-${{ env.CODENAME }}-${{ env.OS_SHORT }}
        path: ${{ env.CONFIG }}/debug/artifacts/
