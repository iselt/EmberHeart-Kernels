    - name: Build Kernel
      shell: bash
      env:
        PYTHONWARNINGS: "ignore:invalid escape sequence"
      run: |
        set -euo pipefail
        echo "::group::Build kernel"
        export KERNEL_DIR=common
        export ROOT_DIR=${KERNEL_PLATFORM}
        cd "${ROOT_DIR}"

        # Inherit build config to add device specific changes. ROOT_DIR, KERNEL_DIR are exported for
        # dual tree sources. KERNEL_PATCHES dir can we used for prebuilts (like boot ramdisk,etc)
        # Key features implemented as of now :
        # - PRE_DEFCONFIG_CMDS : commands to be run before running make on the defconfigs
        #                        Example use case : Disabling some configs which might not be required
        #                                           for a specific device (CAN feature on OnePlus 12)
        #                        How to use : export a function in the BUILD_CONFIG, set PRE_DEFCONFIG_CMDS
        #                                     to that function name
        # - POST_DEFCONFIG_CMDS : commands to be run after running make on the defconfigs
        #                        Example use case : <idk>
        #                        How to use : export a function in the BUILD_CONFIG, set POST_DEFCONFIG_CMDS
        #                                     to that function name
        # - MAKE_FLAGS : flags to be passed to make for compiling the kernel
        # - MAKE_FLAGS_EXTRA : Extra make flags if required for compatibility reasons
        # - CONFIGS : Array containg defconfigs (and fragments) to be used for building kernel, if not set default configuration 
        #             takes over which works best on GKI sources (especially Xiaomi & OnePlus)
        # - PRE_BOOT_MKBOOTIMG_CMDS : commands to be executed before running mkbootimg to create boot image
        #                        Example use case : Overriding mkbootimg args
        #                        How to use : export a function in the BUILD_CONFIG, set PRE_BOOT_MKBOOTIMG_CMDS
        #                                     to that function name
        # - POST_BOOT_MKBOOTIMG_CMDS : commands to be executed after running mkbootimg to create boot image
        #                        Example use case : sign boot images with custom keys (must set AVB_SIGN_BOOT_IMG=0 )
        #                        How to use : export a function in the BUILD_CONFIG, set POST_BOOT_MKBOOTIMG_CMDS
        #                                     to that function name
        # - BOOT_EXTRA_CMDS : Extra commands to be executed for device specific needs
        #                            How to use : export a function in the BUILD_CONFIG, set BOOT_EXTRA_CMDS
        #                                             to that function name
        # - BOOT_MKBOOTIMG_ARGS : Arguments for creating boot image, if left empty build assumes a v4 header
        #                         boot image that has no ramdisk
        # - AVB_SIGN_BOOT_CMDS : commands to be executed to sign the boot image
        #                        boot.img is placed inside ${OUT} dir
        #                        How to use: define a function to sign the boot image
        #                                    then set AVB_SIGN_BOOT_CMDS to that function name
        # - AVB_SIGN_BOOT_IMG : If set to 1, sign boot image (default) else skip
        # - AVB_SIGN_BOOT_ALGO : Defines boot image signing algorithm (defaults to sha256_rsa4096)
        # - AVB_SIGN_BOOT_KEY : Stores absolute path to the custom boot signing key (defaults to gki test keys)
        #   SYSTEM_DLKM_STAGING_DIR holds the root path of the dlkm partition
        # - SYSTEM_DLKM_EXTRA_CMDS : Extra commands to be executed for device specific needs
        #                            How to use : export a function in the BUILD_CONFIG, set SYSTEM_DLKM_EXTRA_CMDS
        #                                             to that function name
        # - SYSTEM_DLKM_EXTRA_FILES : When defined a custom defined function can be evaluated to decide which file(s)
        #                             goes into the dlkm partition. BUILD_CONFIG can use SYSTEM_DLKM_STAGING_DIR
        #                             as root directory of the system_dlkm partition
        #                             Example use case : copy device specific files from ${PREBUILTS} dir to dlkm partition 
        #                             How to use : export a function in the BUILD_CONFIG, set SYSTEM_DLKM_EXTRA_FILES
        #                                          to that function name
        # - SYSTEM_DLKM_PROPS_FILE : Can store a path to custom props file which is not present in ${PREBUILTS} dir
        #                            Example use case : Use a props file already defined somewhere else (e.g KERNEL_DIR)
        #                            How to use : define SYSTEM_DLKM_PROPS_FILE with absolute path of the props file
        #                            Note :  If system_dlkm.prop is present in the ${PREBUILTS} directory then it will get the highest priority
        if [[ -f "${BUILD_CONFIG}" ]]; then
          set -a
            . ${BUILD_CONFIG}
          set +a
        fi

        # Ensure Python warnings are suppressed for scripts invoked by make
        export PYTHONWARNINGS="${PYTHONWARNINGS}"

        if [[ -d "$KERNEL_PLATFORM/build/build-tools/path" ]]; then
          export PATH="$KERNEL_PLATFORM/build/build-tools/path/linux-x86:$PATH"
        else
          export PATH="$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin:$PATH"
        fi

        if [[ "${{ inputs.lto }}" = "Thin" ]]; then
        (
          cd "${KERNEL_DIR}"
          echo '#!/bin/bash' > ld-wrapper
          echo 'ld.lld "$@" --thinlto-cache-dir=$LDCACHE_DIR --thinlto-jobs=$(nproc --all)' >> ld-wrapper
          chmod +x ld-wrapper
        )
          LD="${ROOT_DIR}/${KERNEL_DIR}/ld-wrapper"
        else
          LD="ld.lld"
        fi

        if [[ -f "$KERNEL_PLATFORM/build/build-tools/path/linux-x86/dtc" ]]; then
          DTC="$KERNEL_PLATFORM/build/kernel/build-tools/path/linux-x86/dtc"
        elif [[ -f "$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin/dtc" ]]; then
          DTC="$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin/dtc"
        else
          DTC="dtc"
        fi

        # Allow build.config to override MAKE_FLAGS
        if [[ ! -v MAKE_FLAGS ]]; then
          MAKE_FLAGS+=(
            LLVM=1
            LLVM_IAS=1
            ARCH=arm64
            CROSS_COMPILE="aarch64-linux-gnu-"
            LD="${LD}"
            DTC="${DTC}"
            DTC_FLAGS="-@"
            HOSTCC="ccache clang"
            HOSTCXX="ccache clang++"
            CC="ccache clang"
          )
        fi

        OUT=out
        INSTALL_MOD_PATH="$COMMON/out"
        mkdir -p "$OUT"

        # Allow build.config to override primary defconfig
        if [[ ! -v CONFIGS ]]; then
          CONFIGS=("gki_defconfig")

          if [[ "$BUILD_TYPE" == "Monolithic Build" ]]; then
            # Merge defconfig fragments

            if [[ -f "${KERNEL_DIR}/arch/arm64/configs/vendor/${CODENAME}_GKI.config" ]]; then
              CONFIGS+=("vendor/${CODENAME}_GKI.config")
            elif [[ -f "${KERNEL_DIR}/arch/arm64/configs/vendor/${SOC}_GKI.config" ]]; then
              CONFIGS+=("vendor/${SOC}_GKI.config")
            fi

            if [[ -f "${KERNEL_DIR}/arch/arm64/configs/vendor/oplus/${SOC}_GKI.config" ]]; then
              CONFIGS+=("vendor/oplus/${SOC}_GKI.config")
            fi

            if [[ -f "${KERNEL_DIR}/arch/arm64/configs/vendor/debugfs.config" ]]; then
              CONFIGS+=("vendor/debugfs.config")
            fi
          fi
        fi

        CONFIGS+=("kernel.config")
        declare -a MAKE_FLAGS_EXTRA=()

        (
          cd "${KERNEL_DIR}"

          if [[ -n "${PRE_DEFCONFIG_CMDS:-}" ]]; then
            eval "${PRE_DEFCONFIG_CMDS}"
          fi

          make "${MAKE_FLAGS[@]}" "${MAKE_FLAGS_EXTRA[@]}" O="$OUT" "${CONFIGS[@]}"

          if [[ -n "${POST_DEFCONFIG_CMDS:-}" ]]; then
            eval "${POST_DEFCONFIG_CMDS}"
          fi

          # snapshot the merged defconfig for debugging
          make ARCH=arm64 O="$OUT" savedefconfig
          mv "$OUT/defconfig" "$ARTIFACTS_DIR_DEBUG/merged_defconfig"

          # LOCALVERSION branding
          if [[ -n "${CUSTOM_LOCALVERSION:-}" ]]; then
            : > "$COMMON/.scmversion"
            ./scripts/config --file "$OUT/.config" \
              --set-str LOCALVERSION "${CUSTOM_LOCALVERSION}" \
              --disable LOCALVERSION_AUTO
            sed -i 's/scm_version="$(scm_version --short)"/scm_version=""/' scripts/setlocalversion
            echo "[INFO] Custom branding applied to config"
          else
            ./scripts/config --file "$OUT/.config" \
              --enable LOCALVERSION_AUTO
          fi

          echo "kernel_release=$(make "${MAKE_FLAGS[@]}" O="$OUT" -s kernelrelease)" >> "$GITHUB_ENV"

          echo "Starting build with $(nproc --all) threads..."
          SECONDS=0

          make "${MAKE_FLAGS[@]}" O="$OUT" olddefconfig

          if [[ "$BUILD_TYPE" == "Mixed Build" || "$BUILD_TYPE" == "Modules Only" ]]; then
            MAKE_GOALS=${MAKE_GOALS:-"Image modules"}
            make -j$(nproc --all) "${MAKE_FLAGS[@]}" "${MAKE_FLAGS_EXTRA[@]}" O="$OUT" ${MAKE_GOALS}
            make -j$(nproc --all) "${MAKE_FLAGS[@]}" "${MAKE_FLAGS_EXTRA[@]}" O="$OUT" INSTALL_MOD_STRIP=1 INSTALL_MOD_PATH="$INSTALL_MOD_PATH" modules_install
          else
            MAKE_GOALS=${MAKE_GOALS:-"Image"}
            make -j$(nproc --all) "${MAKE_FLAGS[@]}" "${MAKE_FLAGS_EXTRA[@]}" O="$OUT" Image
          fi

          echo "duration=$SECONDS" >> "$GITHUB_ENV"
        )

        # Build is done now set OUT to absolute path for performing file operations in that dir
        OUT="${ROOT_DIR}/${KERNEL_DIR}/out"

        IMG="$OUT/arch/arm64/boot/Image"
        if [[ ! -f "$IMG" ]]; then
          echo "Kernel Image missing"
          exit 1
        fi
        sha256sum "$IMG" | tee "$OUT/Image.sha256"
        echo "Kernel built 😆"

        cp "$OUT/System.map" "$ARTIFACTS_DIR_DEBUG"

        if [[ "$BUILD_TYPE" == "Mixed Build" || "$BUILD_TYPE" == "Modules Only" ]]; then
          cp "$OUT/Module.symvers" "$ARTIFACTS_DIR_DEBUG"
        fi

        cp "$OUT/.config" "$ARTIFACTS_DIR_DEBUG/config"
        cp "$OUT/vmlinux" "$ARTIFACTS_DIR_DEBUG"
        cp "$OUT/include/config/auto.conf" "$ARTIFACTS_DIR_DEBUG/auto.conf" || true
        find "${OUT}" -type f -name '*.ko' -printf '%f\n' > ${ARTIFACTS_DIR_DEBUG}/gki_modules.txt

        # snapshot the final defconfig for debugging
        ( cd ${KERNEL_DIR} && make "${MAKE_FLAGS[@]}" "${MAKE_FLAGS_EXTRA[@]}" O="$OUT" savedefconfig )
        mv "$OUT/defconfig" "$ARTIFACTS_DIR_DEBUG/final_defconfig"

        echo "::endgroup::"

    - name: Copy Files for Mixed builds
      if: ${{ env.BUILD_TYPE == 'Mixed Build' || env.BUILD_TYPE == 'Kernel Only' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group:: Copying files for mixed build"
        OUT="$COMMON/out"

        cp "$OUT/arch/arm64/boot/Image" "$KBUILD_MIXED_TREE_DIR"
        cp "$OUT/vmlinux" "$KBUILD_MIXED_TREE_DIR"
        cp "$OUT/System.map" "$KBUILD_MIXED_TREE_DIR"
        cp "$OUT/vmlinux.symvers" "$KBUILD_MIXED_TREE_DIR"
        cp "$OUT/modules.builtin" "$KBUILD_MIXED_TREE_DIR"
        cp "$OUT/modules.builtin.modinfo" "$KBUILD_MIXED_TREE_DIR"

        echo "[DEBUG] KBUILD_MIXED_TREE_DIR contents: $(ls ${KBUILD_MIXED_TREE_DIR})"
        echo "::endgroup::"

    - name: Collect Build Stats / Validate Image
      id: collect_kernel_stats
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Collecting Build Stats..."
        OUT="$COMMON/out"
        IMG="$OUT/arch/arm64/boot/Image"

        echo "[DEBUG] Kernel build completed in ${duration}s"

        WARNINGS=$(grep -i -E 'warning:' "$COMMON/build.log" | wc -l || true)
        echo "$WARNINGS" > "${ARTIFACTS_DIR_DEBUG}/warnings.txt"

        if [[ -f "$IMG" ]]; then
          file "$IMG" > "$OUT/Image.file" || true
          KERNEL_UNAME=$(strings "$IMG" | grep -E 'Linux version.*#' | tail -n1 || true)
          echo "Kernel Uname: ${KERNEL_UNAME:-unknown}"
          echo "KERNEL_UNAME=${KERNEL_UNAME:-unknown}" >> "$GITHUB_ENV"

          if ! file "$IMG" | grep -qi 'ARM64'; then
            echo "WARNING: Image does not appear to be ARM64:"
            file "$IMG" || true
          fi

          MIN_SIZE=$((6*1024*1024))
          ACTUAL_SIZE=$(stat -c %s "$IMG" || echo 0)
          if [[ "$ACTUAL_SIZE" -lt "$MIN_SIZE" ]]; then
            echo "WARNING: Image size $ACTUAL_SIZE < $MIN_SIZE (suspicious)."
          fi

          CALC_SHA=$(sha256sum "$IMG" | cut -d' ' -f1)
          if [[ -f "$OUT/Image.sha256" ]]; then
            REC_SHA=$(cut -d' ' -f1 "$OUT/Image.sha256" | tr -d '\n')
            if [[ "$CALC_SHA" != "$REC_SHA" ]]; then
              echo "WARNING: Image.sha256 mismatch. recorded=$REC_SHA calculated=$CALC_SHA"
            fi
            IMAGE_SHA256="$REC_SHA"
          else
            echo "WARNING: Image.sha256 not found, using calculated sha256."
            IMAGE_SHA256="$CALC_SHA"
          fi
        else
          echo "WARNING: Image file not found at $IMG"
          IMAGE_SHA256=""
          KERNEL_UNAME="unknown"
          echo "KERNEL_UNAME=unknown" >> "$GITHUB_ENV"
        fi

        echo "Image sha256: ${IMAGE_SHA256:-none}"
        echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"
        echo "image_sha256=${IMAGE_SHA256:-}" >> "$GITHUB_OUTPUT"

        echo "Build stats collected ✅"
        echo "::endgroup::"

    - name: Create Kernel ZIP
      id: create_zip
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Creating AK3 zip..."
        IMAGE_PATH="$COMMON/out/arch/arm64/boot/Image"
        if [[ ! -f "$IMAGE_PATH" ]]; then
          echo "ERROR: Built Image not found"
          exit 1
        fi

        # Put Image into AnyKernel3
        cp "$IMAGE_PATH" "$GITHUB_WORKSPACE/AnyKernel3/Image"
        cd "$GITHUB_WORKSPACE/AnyKernel3"

        if [[ "${{ inputs.use_susfs }}" = "true" ]]; then
          ZIP_NAME="AnyKernel3_${{ env.CODENAME }}-${{ env.OS_SHORT }}_${{ inputs.optimize_level }}_${{ env.KERNEL_FULL_VER }}_Next_${KSUVER}_SuSFS_${SUSVER}.zip"
        else
          ZIP_NAME="AnyKernel3_${{ env.CODENAME }}-${{ env.OS_SHORT }}_${{ inputs.optimize_level }}_${{ env.KERNEL_FULL_VER }}_Next_${KSUVER}.zip"
        fi

        echo "Creating flashable zip: $ZIP_NAME"
        ( cd "$GITHUB_WORKSPACE/AnyKernel3" && zip -r "$ARTIFACTS_DIR/$ZIP_NAME" ./* >/dev/null )

        # Keep only the flashable zip and the model metadata file (assumed already created earlier)
        find "$ARTIFACTS_DIR" -maxdepth 1 -type f ! -name "$ZIP_NAME" -delete

        # Output for later steps (optional)
        echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

        echo "AnyKernel3 zip created ✅"
        echo "::endgroup::"

    - name: Create Boot Image
      if: success() && steps.create_zip.conclusion == 'success'
      id: create_boot
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Creating boot image..."
        OUT="$COMMON/out"
        IMAGE="$OUT/arch/arm64/boot/Image"

        if [[ -f "$KERNEL_PLATFORM/tools/mkbootimg/mkbootimg.py" ]]; then
          MKBOOTIMG="$KERNEL_PLATFORM/tools/mkbootimg/mkbootimg.py"
        else
          MKBOOTIMG="mkbootimg"
        fi

        if [[ -f "${BUILD_CONFIG}" ]]; then
          set -a
            . ${BUILD_CONFIG}
          set +a
        fi

        if [[ -d "$KERNEL_PLATFORM/build/build-tools/path" ]]; then
          export PATH="$KERNEL_PLATFORM/build/build-tools/path/linux-x86:$PATH"
        else
          export PATH="$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin:$PATH"
        fi

        if [ -n "${PRE_BOOT_MKBOOTIMG_CMDS:-}" ]; then
          eval "${PRE_BOOT_MKBOOTIMG_CMDS}"
        fi

        if [ -n "${BOOT_EXTRA_CMDS:-}" ]; then
          eval "${BOOT_EXTRA_CMDS}"
        fi

        # Allow build.config files to override generic v4 no ramdisk mkbootimg flags
        if [[ ! -v BOOT_MKBOOTIMG_ARGS ]]; then
          BOOT_MKBOOTIMG_ARGS=(
            "--header_version" "4"
            "--os_version" "13.0.0"
            "--os_patch_level" "2099-12-01"
            "--pagesize" "4096"
            "--kernel" "$IMAGE"
            "--output" "$OUT/boot.img"
          )
        fi

        echo "Creating boot image"
        "$MKBOOTIMG" "${BOOT_MKBOOTIMG_ARGS[@]}"
        
        if [ -n "${POST_BOOT_MKBOOTIMG_CMDS:-}" ]; then
          eval "${POST_BOOT_MKBOOTIMG_CMDS}"
        fi

        # Allow build.config to sign boot images using custom algo and keys
        if [[ -n "${AVB_SIGN_BOOT_CMDS:-}" ]]; then
          echo "Signing boot image"
          eval "${AVB_SIGN_BOOT_CMDS}"
        elif [[ "${AVB_SIGN_BOOT_IMG:-1}" == "1" ]]; then
          # Allow build.config to override boot image signing
          # Users have three choices : - sign manually using their own keys
          #                            - sign using test keys
          #                            - don't sign at all
          echo "Signing boot image"

          # Allow build.config to ovveride default signing algorithm and boot signing key
          AVB_SIGN_BOOT_ALGO=${AVB_SIGN_BOOT_ALGO:-SHA256_RSA4096}
          AVB_SIGN_BOOT_KEY=${AVB_SIGN_BOOT_KEY:-${KERNEL_PLATFORM}/tools/mkbootimg/gki/testdata/testkey_rsa4096.pem}

          avbtool add_hash_footer \
            --partition_name boot \
            --partition_size "${BOOT_PARTITION_SIZE}" \
            --image "${OUT}/boot.img" \
            --algorithm "${AVB_SIGN_BOOT_ALGO}" \
            --key "${AVB_SIGN_BOOT_KEY}"
        fi

        cp "$OUT/boot.img" "$ARTIFACTS_DIR"
        BOOT_SHA256=$(sha256sum "$OUT/boot.img" | cut -d' ' -f1)
        echo "boot_sha256=${BOOT_SHA256:-ERROR}" >> "$GITHUB_OUTPUT"

        echo "Boot image created ✅"
        echo "::endgroup::"

    - name: Upload Kernel Artifacts to Telegram
      if: ${{ inputs.tg_enabled == 'true' && success() && steps.create_boot.conclusion == 'success' }}
      uses: ./.github/telegram
      with:
        bot_token: ${{ inputs.tg_bot_token }}
        chat_id: ${{ inputs.tg_chat_id }}
        thread_id: ${{ inputs.tg_thread_id }}
        api_base_url: ${{ inputs.tg_api_base }}
        mode: media-group
        files: |
          ${{ env.ARTIFACTS_DIR }}/${{ steps.create_zip.outputs.zip_name }}
          ${{ env.ARTIFACTS_DIR }}/boot.img
        message: |
          # Kernel Artifacts
          ```
          Model: ${{ env.PRODUCT }}
          Kernel Version: ${{ steps.get_kernel_version.outputs.kernel_version }}
          Compiler: {{ env.CLANG_VERSION }}
          KernelSU Next: ${{ steps.add_ksun.outputs.ksun_tag }}
          ```

    - name: Create system_dlkm Image
      if: ${{ inputs.compile_dlkm == 'true'  && env.BUILD_TYPE != 'Monolithic Build' }}
      id: create_system_dlkm
      shell: bash
      run: |
        PREBUILTS="${KERNEL_PATCHES}/device/${CODENAME}-${OS_SHORT}/system_dlkm"
        OUT="${COMMON}/out"
        UNAME=$(ls "${OUT}/lib/modules/")
        SYSTEM_DLKM_STAGING_DIR="${OUT}/system_dlkm_staging"
        SYSTEM_DLKM_STAGING_ROOT="${SYSTEM_DLKM_STAGING_DIR}/lib/modules/${UNAME}"

        if [[ -d "${KERNEL_PLATFORM}/build/build-tools/path" ]]; then
          export PATH="${KERNEL_PLATFORM}/build/build-tools/path/linux-x86:$PATH"
        else
          export PATH="${KERNEL_PLATFORM}/prebuilts/kernel-build-tools/linux-x86/bin:$PATH"
        fi

        if [[ -f "${BUILD_CONFIG}" ]]; then
          set -a
            . ${BUILD_CONFIG}
          set +a
        fi

        # Don't create SYSTEM_DLKM_STAGING_DIR and copy the OUT/lib folder cause it has many unnecessary files
        # Instead create lib and copy modules folder from OUT/lib/modules to SYSTEM_DLKM_STAGING_DIR/lib/
        mkdir -p "${SYSTEM_DLKM_STAGING_DIR}/lib"
        
        # copy modules and other files generated by depmod to staging dir
        cp -a "${OUT}/lib/modules" "${SYSTEM_DLKM_STAGING_DIR}/lib/"

        if [[ -f "${PREBUILTS}/system_dlkm.modules.load" ]]; then
          cp "${PREBUILTS}/system_dlkm.modules.load" "${SYSTEM_DLKM_STAGING_ROOT}/modules.load"
        else
          cp "${SYSTEM_DLKM_STAGING_ROOT}/modules.order" "${SYSTEM_DLKM_STAGING_ROOT}/modules.load"
        fi
        cp "${SYSTEM_DLKM_STAGING_ROOT}/modules.load" "${OUT}/system_dlkm.modules.load"

        # remove unnecessary files from SYSTEM_DLKM_STAGING_ROOT
        cd "${SYSTEM_DLKM_STAGING_ROOT}"
        rm build source || true

        # Add other files found in stock system_dlkm
        # Allow build.config to define what goes into system_dlkm
        if [[ ! -v SYSTEM_DLKM_EXTRA_FILES ]]; then
          mkdir -p "${SYSTEM_DLKM_STAGING_DIR}/etc"
          if [[ -f "${PREBUILTS}/etc/build.prop" ]]; then
            cp "${PREBUILTS}/etc/build.prop" "${SYSTEM_DLKM_STAGING_DIR}/etc"
            touch "${SYSTEM_DLKM_STAGING_DIR}/etc/fs_config_dirs" "${SYSTEM_DLKM_STAGING_DIR}/etc/fs_config_files"
          fi
        else
          eval "${SYSTEM_DLKM_EXTRA_FILES}"
        fi

        # Create temporary prop file for system_dlkm image
        system_dlkm_props_file="$(mktemp)"

        # Allow build.config to introduce custom system_dlkm props file
        if [[ -f "${PREBUILTS}/system_dlkm.prop" ]]; then
          echo -e "::debug:: Using custom system_dlkm prop file with props:\n$(cat "${PREBUILTS}/system_dlkm.prop")"
          cat "${PREBUILTS}/system_dlkm.prop" >> ${system_dlkm_props_file}
        else
          if [[ ! -v SYSTEM_DLKM_PROPS_FILE ]]; then
            echo -e "system_dlkm_fs_type=ext4\n" >> ${system_dlkm_props_file}
            echo -e "use_dynamic_partition_size=true\n" >> ${system_dlkm_props_file}
            echo -e "ext_mkuserimg=mkuserimg_mke2fs\n" >> ${system_dlkm_props_file}
            echo -e "ext4_share_dup_blocks=true\n" >> ${system_dlkm_props_file}
            # echo -e "partition_name=system_dlkm\n" >> ${system_dlkm_props_file}
            # echo -e "mount_point=system_dlkm\n" >> ${system_dlkm_props_file}

            if [[ -f "${PREBUILTS}/system_dlkm.selinux.fc" ]]; then
              echo -e "selinux_fc=${PREBUILTS}/system_dlkm.selinux.fc\n" >> ${system_dlkm_props_file}
            fi
          else
            echo -e "::debug:: Using custom system_dlkm prop file with props:\n$(cat "${SYSTEM_DLKM_PROPS_FILE}")"
            cat "${SYSTEM_DLKM_PROPS_FILE}" >> ${system_dlkm_props_file}
          fi
        fi

        # Extra cmds for device specific needs
        if [[ -v SYSTEM_DLKM_EXTRA_CMDS ]]; then
          eval "${SYSTEM_DLKM_EXTRA_CMDS}"
        fi

        echo -e "::debug:: system_dlkm staging tree :\n$(tree "${SYSTEM_DLKM_STAGING_DIR}")" | tee "${ARTIFACTS_DIR_DEBUG}/system_dlkm.tree"

        echo "::info:: Building system_dlkm Image"
        build_image "${SYSTEM_DLKM_STAGING_DIR}" "${system_dlkm_props_file}" "${OUT}/system_dlkm.img" /dev/null

        echo "::info:: Adding hashtree footer using avbtool"
        avbtool add_hashtree_footer \
            --partition_name system_dlkm \
            --image "${OUT}/system_dlkm.img"

        SYSTEM_DLKM_SHA256=$(sha256sum "${OUT}/system_dlkm.img" | cut -d' ' -f1)
        echo "system_dlkm_sha256=${SYSTEM_DLKM_SHA256:-ERROR}" >> "$GITHUB_OUTPUT"

        cp "${OUT}/system_dlkm.img" "${ARTIFACTS_DIR}"
        cp "${OUT}/system_dlkm.modules.load" "${ARTIFACTS_DIR}"
        cp "${OUT}/system_dlkm.modules.load" "${ARTIFACTS_DIR_DEBUG}"

    - name: Format build time
      id: build_time
      shell: bash
      run: |
        set -euo pipefail

        if [[ "$duration" -ge 60 ]]; then
          duration="$((duration / 60))m $((duration % 60))s"
        else
          duration="${duration}s"
        fi

        echo "duration=$duration" >> "$GITHUB_OUTPUT"

    - name: Final Build Summary
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "### Kernel Build Summary"
          echo "----"
          echo ""
          echo "> [!NOTE]"
          echo "> Model: ${{ env.PRODUCT }}"
          echo ""
          echo "- Kernel Release: ${{ env.kernel_release }}"
          echo "- Kernel Uname: ${{ env.KERNEL_UNAME }}"
          echo "- KSUN Version: ${KSUVER:-unknown}"
          echo "- KSUN commit SHA: [${{ env.KSUN_COMMIT_SHA }}](https://github.com/KernelSU-Next/KernelSU-Next/commit/${{ env.KSUN_COMMIT_SHA }})"

          if [[ "${{ inputs.use_susfs }}" == "true" ]]; then
            echo "- SUSFS Version: ${SUSVER:-unknown}"
            echo "- SUSFS commit SHA: [${{ env.SUSFS_COMMIT_SHA }}](https://gitlab.com/simonpunk/susfs4ksu/-/commit/${{ env.SUSFS_COMMIT_SHA }})"
          fi

          echo "- Optimization: ${{ inputs.optimize_level }}"
          echo ""
          echo "> [!IMPORTANT]"
          echo "> - Kernel Image SHA256: ${{ steps.collect_kernel_stats.outputs.image_sha256 }}"
          echo "> - Boot image SHA256: ${{ steps.create_boot.outputs.boot_sha256 }}"

          if [[ "${{ inputs.compile_dlkm }}" == "true" ]]; then
            echo "> - System dlkm image SHA256: ${{ steps.create_system_dlkm.outputs.system_dlkm_sha256 }}"
          fi

          echo ""
          echo "> [!NOTE]"
          echo "> Build completed in ${{ steps.build_time.outputs.duration }}"
          echo ""
          echo "> [!IMPORTANT]"
          echo "> ## CCache Statistics :"
          echo "> $(ccache -s -v)"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Cleanup old ccache & upload ccache log
      shell: bash
      run: |
        set -euo pipefail

        echo "[DEBUG] Uploading ccache logs"
        cp "$CCACHE_LOGFILE" "$ARTIFACTS_DIR_DEBUG"

        # Evict untouched ccache contents
        ccache_end=$(date +%s)
        ccache_delta=$(( ccache_end - ccache_start ))
        if [[ "${{ inputs.evict_unused_ccache }}" == "true" ]]; then
          echo "[DEBUG] Deleting ccache contents older than $ccache_delta seconds"
          ccache --evict-older-than "${ccache_delta}s"
        fi

        echo "[WARNING] Deleting old LTO cache..."
        gh cache delete LTO-${{ env.CODENAME }}-${{ env.OS_SHORT }}-kernel-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }} || true

        echo "[WARNING] Deleting old ccache..."
        gh cache delete ccache-${{ env.CODENAME }}-${{ env.OS_SHORT }}-kernel-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }} || true

    - name: Purge old mixed artifacts
      if: ${{ env.BUILD_TYPE == 'Mixed Build' || env.BUILD_TYPE == 'Kernel Only' }}
      shell: bash
      run: |
        gh cache delete ${{ env.CODENAME }}-${{ env.OS_SHORT }}-MIXED-TREE-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }} || true

    - name: Save ccache
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ env.CODENAME }}-${{ env.OS_SHORT }}-kernel-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}-${{ inputs.lto }}_LTO

    - name: Save LTO cache
      if: ${{ inputs.lto == 'Thin' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.LDCACHE_DIR }}
        key: LTO-${{ env.CODENAME }}-${{ env.OS_SHORT }}-kernel-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}

    - name: Save files for Mixed builds
      if: ${{ env.BUILD_TYPE == 'Mixed Build' || env.BUILD_TYPE == 'Kernel Only' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.KBUILD_MIXED_TREE_DIR }}
        key: ${{ env.CODENAME }}-${{ env.OS_SHORT }}-MIXED-TREE-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}

    - name: Upload Artifacts
      if: success() && steps.create_zip.conclusion == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: kernel-${{ env.CODENAME }}-${{ env.OS_SHORT }}
        path: ${{ env.CONFIG }}/artifacts/

    - name: Zip debug artifacts for Telegram uploads
      id: tg_debug_zip
      if: ${{ inputs.tg_enabled == 'true' && inputs.tg_send_debug == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "$(ls -A "$ARTIFACTS_DIR_DEBUG" 2>/dev/null)" ]]; then
          echo "::warning::No debug artifacts found for common kernel, skipping notify."
          echo "zip_path=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        DEBUG_ZIP="/tmp/debug-common-${{ env.CODENAME }}-${{ env.OS_SHORT }}-${GITHUB_RUN_NUMBER}.zip"
        ( cd "$ARTIFACTS_DIR_DEBUG" && zip -r9 "$DEBUG_ZIP" ./* >/dev/null )
        echo "zip_path=$DEBUG_ZIP" >> "$GITHUB_OUTPUT"

    - name: Upload debug artifacts to Telegram
      if: ${{ inputs.tg_enabled == 'true' && inputs.tg_send_debug == 'true' && steps.tg_debug_zip.outputs.zip_path != '' }}
      uses: ./.github/telegram
      with:
        bot_token: ${{ inputs.tg_bot_token }}
        chat_id: ${{ inputs.tg_chat_id }}
        thread_id: ${{ inputs.tg_thread_id }}
        api_base_url: ${{ inputs.tg_api_base }}
        mode: media-group
        files: |
          ${{ env.ARTIFACTS_DIR_DEBUG }}/config
          ${{ steps.tg_debug_zip.outputs.zip_path }}
        message: |
          # 🐛 Debug Artifacts (common)
          ```
          Model:${{ env.PRODUCT }}
          Build time: ${{ steps.build_time.outputs.duration }}
          ```

    - name: Upload Debug zip
      uses: actions/upload-artifact@v4
      with:
        name: debug-common-${{ env.CODENAME }}-${{ env.OS_SHORT }}
        path: ${{ env.CONFIG }}/debug/artifacts/
